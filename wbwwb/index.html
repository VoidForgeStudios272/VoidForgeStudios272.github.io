<!doctype html>
<html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>WBWWB — VoidForge</title>
<style>
*{box-sizing:border-box}body{margin:0;background:#070712;color:#eee;font:16px system-ui,sans-serif;text-align:center}#wrap{max-width:920px;margin:auto;padding:12px}h1{margin:8px 0 3px}.sub{color:#aaa;margin:0 12px 12px}.bar{display:flex;gap:8px;justify-content:center;flex-wrap:wrap;margin:8px}.pill{padding:6px 10px;border:1px solid #39394f;border-radius:999px;color:#bbb}canvas{display:block;width:100%;max-width:900px;height:auto;margin:auto;border:1px solid #39394f;background:#151521;cursor:crosshair;touch-action:none}button{padding:10px 15px;border:0;border-radius:8px;cursor:pointer;margin:5px}.hint{color:#888;font-size:13px}#status{min-height:24px;color:#ccc}
</style></head><body><main id="wrap"><h1>WBWWB — VoidForge Edition</h1><p class="sub">An original camera-driven social simulation.</p>
<div class="bar"><span class="pill">Stories: <b id="stories">0</b></span><span class="pill">Tension: <b id="tension">0</b></span><span class="pill">Attention: <b id="attention">0</b></span></div>
<canvas id="game" width="900" height="560" aria-label="WBWWB game area"></canvas><p id="status" aria-live="polite">Move the camera and capture a highlighted moment.</p>
<button id="restart" type="button">Restart</button><button id="bookmark" type="button">Bookmark this game</button><p class="hint">Drag the camera box, then tap/click a highlighted event. R = restart.</p></main>
<script>
(()=>{"use strict";
const c=document.getElementById("game"),ctx=c.getContext("2d"),W=900,H=560;
const ui={stories:document.getElementById("stories"),tension:document.getElementById("tension"),attention:document.getElementById("attention"),status:document.getElementById("status")};
let camera,stories,tension,attention,over,events,people,spawnTimer=0,lastTime=0,raf=0,drag=false;
const names=["Mara","Theo","June","Ren","Sol","Kai","Nia","Beck"];
const types=[["kind","A stranger helps someone up"],["argument","Two people start arguing"],["celebration","A small celebration begins"],["rumor","Someone points and whispers"],["accident","A messy accident draws a crowd"]];
function setStatus(v){ui.status.textContent=v}
function addEvent(){if(over||events.length>=5)return;const t=types[(Math.random()*types.length)|0];events.push({x:100+Math.random()*700,y:130+Math.random()*330,type:t[0],text:t[1],hot:true})}
function reset(){camera={x:450,y:280};stories=0;tension=0;attention=0;over=false;events=[];spawnTimer=0;people=[];for(let i=0;i<8;i++)people.push({x:80+Math.random()*740,y:120+Math.random()*330,vx:(Math.random()-.5)*35,vy:(Math.random()-.5)*28,mood:"calm"});for(let i=0;i<3;i++)addEvent();setStatus("Move the camera and capture a highlighted moment.");updateUI()}
function updateUI(){ui.stories.textContent=stories;ui.tension.textContent=tension;ui.attention.textContent=attention}
function capture(){if(over)return;const e=events.find(v=>v.hot&&Math.hypot(camera.x-v.x,camera.y-v.y)<130);if(!e){setStatus("Nothing compelling is inside the frame.");return}stories++;e.hot=false;attention+=["argument","rumor","accident"].includes(e.type)?3:1;tension+=e.type==="argument"?3:e.type==="rumor"?2:e.type==="accident"?1:-1;people.forEach(p=>{if(Math.hypot(p.x-e.x,p.y-e.y)<180)p.mood=e.type==="kind"?"warm":e.type==="celebration"?"excited":"alarmed"});setStatus("Published: "+e.text+" — the crowd reacts.");updateUI();if(tension>=12){over=true;setStatus("The feed is now dominated by outrage. Restart for another path.");}else if(stories>=10){over=true;setStatus(tension<4?"The crowd chose connection over outrage.":"Your feed became a mirror of the loudest moments.");}}
function pointerPos(e){const r=c.getBoundingClientRect();return{x:Math.max(0,Math.min(W,(e.clientX-r.left)*W/r.width)),y:Math.max(0,Math.min(H,(e.clientY-r.top)*H/r.height))}}
c.addEventListener("pointerdown",e=>{const p=pointerPos(e);camera.x=p.x;camera.y=p.y;drag=true;c.setPointerCapture?.(e.pointerId);capture()});
c.addEventListener("pointermove",e=>{if(!drag)return;const p=pointerPos(e);camera.x=p.x;camera.y=p.y});
c.addEventListener("pointerup",e=>{drag=false;c.releasePointerCapture?.(e.pointerId)});
c.addEventListener("pointercancel",()=>drag=false);
document.getElementById("restart").addEventListener("click",reset);
document.addEventListener("keydown",e=>{if(e.key.toLowerCase()==="r")reset()});
document.getElementById("bookmark").addEventListener("click",()=>{const url=new URL(location.href);url.hash="game";history.replaceState(null,"",url.href);setStatus("Bookmark ready — use your browser's bookmark command (Ctrl+D / ⌘D).");});
function frame(t){if(document.hidden){raf=requestAnimationFrame(frame);return}const dt=Math.min(.05,Math.max(0,(t-lastTime)/1000||0));lastTime=t;if(!over){spawnTimer+=dt;if(spawnTimer>=2.5){spawnTimer=0;addEvent()}people.forEach(p=>{p.x=(p.x+p.vx*dt+W)%W;p.y=(p.y+p.vy*dt+H)%H;if(p.y<90)p.y=90;if(p.y>500)p.y=500})}
ctx.clearRect(0,0,W,H);ctx.fillStyle="#1a1a29";ctx.fillRect(0,0,W,H);ctx.fillStyle="#252538";for(let i=0;i<12;i++)ctx.fillRect(i*80,80+(i%2)*30,60,2);
ctx.textAlign="center";ctx.font="12px system-ui";events.forEach(e=>{if(!e.hot)return;ctx.beginPath();ctx.arc(e.x,e.y,28,0,Math.PI*2);ctx.fillStyle=e.type==="kind"?"#4d7":"#c56";ctx.fill();ctx.fillStyle="#fff";ctx.fillText(e.text,e.x,e.y-38)});
people.forEach(p=>{ctx.fillStyle=p.mood==="warm"?"#7c9":p.mood==="excited"?"#db8":p.mood==="alarmed"?"#c77":"#888";ctx.beginPath();ctx.arc(p.x,p.y,13,0,Math.PI*2);ctx.fill()});
ctx.strokeStyle="#fff";ctx.lineWidth=2;ctx.strokeRect(camera.x-90,camera.y-60,180,120);ctx.fillStyle="#fff";ctx.font="13px system-ui";ctx.fillText("CAMERA",camera.x,camera.y-68);
raf=requestAnimationFrame(frame)}
reset();raf=requestAnimationFrame(frame);
})();
</script></body></html>
