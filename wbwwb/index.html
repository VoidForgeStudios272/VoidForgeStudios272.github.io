<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>WBWWB — VoidForge</title><style>*{box-sizing:border-box}body{margin:0;background:#070712;color:#eee;font:16px system-ui;text-align:center}#wrap{max-width:920px;margin:auto;padding:14px}canvas{display:block;width:100%;max-width:900px;height:auto;margin:auto;background:#151521;border:1px solid #39394f;touch-action:none}button{padding:10px 16px;margin:6px;border:0;border-radius:8px}.bar{display:flex;gap:8px;justify-content:center;flex-wrap:wrap}.pill{padding:6px 10px;border:1px solid #39394f;border-radius:999px;color:#bbb}.sub,.hint{color:#999}.sub{margin:0 0 12px}#status{min-height:24px}</style></head><body><main id="wrap"><h1>WBWWB — VoidForge Edition</h1><p class="sub">An original camera-driven social simulation.</p><div class="bar"><span class="pill">Stories: <b id="stories">0</b></span><span class="pill">Tension: <b id="tension">0</b></span><span class="pill">Attention: <b id="attention">0</b></span></div><canvas id="game" width="900" height="560"></canvas><p id="status">Move the camera and capture a highlighted moment.</p><button id="restart">Restart</button><button id="bookmark">🔖 Bookmark</button><p class="hint">Click/tap a highlighted event. Drag the camera box. R restarts.</p></main><script>(()=>{const c=document.getElementById("game"),g=c.getContext("2d"),W=900,H=560,$=id=>document.getElementById(id);let cam={x:450,y:280},stories=0,tension=0,attention=0,over=false,events=[],people=[],last=0,spawn=0,drag=false;const names=["Mara","Theo","June","Ren","Sol","Kai","Nia","Beck"],types=[["kind","A stranger helps someone up"],["argument","Two people start arguing"],["celebration","A small celebration begins"],["rumor","Someone points and whispers"],["accident","A messy accident draws a crowd"]];function status(s){$("status").textContent=s}function addEvent(){if(over||events.length>4)return;const t=types[Math.floor(Math.random()*types.length)];events.push({x:100+Math.random()*700,y:130+Math.random()*330,type:t[0],text:t[1],hot:true})}function reset(){cam={x:450,y:280};stories=tension=attention=0;over=false;events=[];people=[];spawn=0;for(let i=0;i<8;i++)people.push({x:80+Math.random()*740,y:120+Math.random()*330,vx:(Math.random()-.5)*30,vy:(Math.random()-.5)*24,mood:"calm"});for(let i=0;i<3;i++)addEvent();status("Move the camera and capture a highlighted moment.");ui()}function ui(){$("stories").textContent=stories;$("tension").textContent=tension;$("attention").textContent=attention}function pos(e){const r=c.getBoundingClientRect();return{x:(e.clientX-r.left)*W/r.width,y:(e.clientY-r.top)*H/r.height}}function capture(){if(over)return;const e=events.find(v=>v.hot&&Math.hypot(cam.x-v.x,cam.y-v.y)<130);if(!e){status("Nothing compelling is inside the frame.");return}stories++;e.hot=false;attention+=["argument","rumor","accident"].includes(e.type)?3:1;tension+=e.type==="argument"?3:e.type==="rumor"?2:e.type==="accident"?1:-1;people.forEach(p=>{if(Math.hypot(p.x-e.x,p.y-e.y)<180)p.mood=e.type==="kind"?"warm":e.type==="celebration"?"excited":"alarmed"});status("Published: "+e.text+" — the crowd reacts.");ui();if(tension>=12){over=true;status("The feed is dominated by outrage. Restart to try again.")}else if(stories>=10){over=true;status(tension<4?"The crowd chose connection over outrage.":"Your feed became a mirror of the loudest moments.")}}c.addEventListener("pointerdown",e=>{const p=pos(e);cam.x=p.x;cam.y=p.y;drag=true;c.setPointerCapture?.(e.pointerId);capture()});c.addEventListener("pointermove",e=>{if(drag){const p=pos(e);cam.x=p.x;cam.y=p.y}});c.addEventListener("pointerup",()=>drag=false);c.addEventListener("pointercancel",()=>drag=false);$("restart").onclick=reset;$("bookmark").onclick=()=>{const u=new URL(location.href);u.hash="game";history.replaceState(null,"",u);status("Ready to bookmark — press Ctrl+D or ⌘D.")};document.onkeydown=e=>{if(e.key.toLowerCase()==="r")reset()};function draw(t){if(document.hidden){requestAnimationFrame(draw);return}const dt=Math.min(.033,(t-last)/1000||0);last=t;if(!over){spawn+=dt;if(spawn>3){spawn=0;addEvent()}for(const p of people){p.x=(p.x+p.vx*dt+W)%W;p.y=(p.y+p.vy*dt+H)%H;if(p.y<90)p.y=90;if(p.y>500)p.y=500}}g.clearRect(0,0,W,H);g.fillStyle="#1a1a29";g.fillRect(0,0,W,H);g.fillStyle="#252538";for(let i=0;i<12;i++)g.fillRect(i*80,90+(i%2)*30,60,2);for(const e of events)if(e.hot){g.beginPath();g.arc(e.x,e.y,28,0,Math.PI*2);g.fillStyle=e.type==="kind"?"#4d7":"#c56";g.fill();g.fillStyle="#fff";g.font="12px system-ui";g.textAlign="center";g.fillText(e.text,e.x,e.y-38)}for(const p of people){g.fillStyle=p.mood==="warm"?"#7c9":p.mood==="excited"?"#db8":p.mood==="alarmed"?"#c77":"#888";g.beginPath();g.arc(p.x,p.y,13,0,Math.PI*2);g.fill()}g.strokeStyle="#fff";g.lineWidth=2;g.strokeRect(cam.x-90,cam.y-60,180,120);g.fillStyle="#fff";g.font="13px system-ui";g.fillText("CAMERA",cam.x,cam.y-68);requestAnimationFrame(draw)}reset();requestAnimationFrame(draw)})()</script></body></html>
