<!doctype html>
<html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no,viewport-fit=cover"><meta name="theme-color" content="#080d19"><title>Skybound | VoidForge</title>
<style>
*{box-sizing:border-box}body{margin:0;min-height:100vh;background:#070d18;color:#eff6ff;font:15px system-ui;display:grid;place-items:center;padding:12px}.shell{width:min(1100px,100%);padding:18px;background:#101a2b;border:1px solid #2b4160;border-radius:20px;box-shadow:0 24px 80px #0009}.top{display:flex;justify-content:space-between;align-items:center;gap:12px;flex-wrap:wrap}h1{font-size:clamp(22px,4vw,34px);margin:0}.sub{color:#9db2cf;margin:4px 0 14px}.stats{display:flex;gap:8px;flex-wrap:wrap}.stat{background:#091323;border:1px solid #263d5c;padding:8px 11px;border-radius:10px;color:#a8bad2;font-size:12px}.stat b{color:white;margin-left:5px}#game{display:block;width:100%;height:auto;aspect-ratio:16/9;border-radius:14px;border:1px solid #29415f;background:#07101d;touch-action:none}.bottom{display:flex;justify-content:space-between;align-items:center;gap:10px;flex-wrap:wrap;margin-top:12px;color:#a8bad2}.actions{display:flex;gap:8px}button{border:1px solid #42648d;background:#1b3555;color:white;border-radius:11px;padding:11px 16px;font:inherit;font-weight:650;touch-action:manipulation;user-select:none}button:active{background:#3a679b;transform:scale(.97)}.mobile{display:none;grid-template-columns:1fr auto;align-items:center;gap:16px;margin-top:14px;touch-action:none}.dpad{display:grid;grid-template-columns:repeat(3,56px);grid-template-rows:repeat(2,52px);gap:6px}.dpad button{padding:0;font-size:22px}.dpad .up{grid-column:2}.dpad .left{grid-column:1;grid-row:2}.dpad .down{grid-column:2;grid-row:2}.dpad .right{grid-column:3;grid-row:2}.action{min-width:90px;min-height:90px;border-radius:50%;background:#174c69;border-color:#42c8f5;font-size:15px}.hint{font-size:13px}@media(max-width:700px){body{padding:7px;display:block}.shell{padding:12px;border-radius:15px}.mobile{display:grid}.hint{max-width:100%}.bottom{align-items:flex-start}button{padding:10px 12px}}@media(orientation:portrait) and (max-width:700px){#game{aspect-ratio:4/3}}

/* VoidForge cross-device polish */
html,body{width:100%;min-height:100%;overscroll-behavior:none}
body{min-height:100dvh;padding:clamp(6px,1.5vw,12px)}
.shell{width:min(1100px,100%);min-width:0}
#game{width:100%;max-width:100%;height:auto;display:block;touch-action:none}
.mobile{padding-bottom:max(4px,env(safe-area-inset-bottom))}
.mobile button{min-width:48px;min-height:48px;touch-action:none;-webkit-user-select:none;user-select:none}
.dpad button{width:clamp(48px,13vw,60px);height:clamp(48px,12vw,58px);border-radius:14px}
.action{min-width:clamp(68px,19vw,92px);min-height:clamp(68px,19vw,92px)}
.actions{flex-wrap:wrap}
@media(max-width:700px){
 body{display:block;padding:env(safe-area-inset-top) 6px env(safe-area-inset-bottom)}
 .shell{padding:clamp(9px,2.5vw,14px);border-radius:14px}
 .top{align-items:flex-start}
 .stats{width:100%;display:grid;grid-template-columns:repeat(3,minmax(0,1fr))}
 .stat{min-width:0;padding:7px 6px;font-size:10px}
 #game{aspect-ratio:4/3;max-height:54dvh}
 .bottom{gap:8px}
 .actions{width:100%;display:grid;grid-template-columns:1fr 1fr}
 .actions button{min-height:44px}
 .mobile{display:grid;grid-template-columns:minmax(0,1fr) auto;gap:clamp(10px,5vw,28px);align-items:center;margin:12px 2px 4px}
 .dpad{justify-self:start}
}
@media(max-height:560px) and (orientation:landscape){
 body{display:block}
 .shell{padding:7px}
 .top{gap:5px}
 .sub{margin:2px 0 5px}
 #game{aspect-ratio:16/7;max-height:48dvh}
 .mobile{margin-top:6px}
 .dpad{grid-template-rows:repeat(2,42px)}
 .dpad button{height:42px;min-height:42px}
 .action{min-height:60px;min-width:60px}
}
@media(prefers-reduced-motion:reduce){*{scroll-behavior:auto!important;transition:none!important}}
</style></head><body><main class="shell"><div class="top"><div><h1>Skybound</h1><p class="sub">VOIDFORGE 3D ARCADE • Mobile + Desktop</p></div><div class="stats"><div class="stat">SCORE <b id="score">0</b></div><div class="stat">BEST <b id="best">0</b></div><div class="stat">STATUS <b id="status">READY</b></div></div></div><canvas id="game" aria-label="Interactive 3D game"></canvas><div class="bottom"><span class="hint" id="hint">Use WASD / arrow keys or the mobile controls.</span><div class="actions"><button id="start">Start / Restart</button><button id="pause">Pause</button></div></div><div class="mobile" aria-label="Touch controls"><div class="dpad"><button class="up" data-key="up">▲</button><button class="left" data-key="left">◀</button><button class="down" data-key="down">▼</button><button class="right" data-key="right">▶</button></div><button class="action" data-key="action">ACTION</button></div></main>
<script type="module">
import * as THREE from 'https://cdn.jsdelivr.net/npm/three@0.160.0/build/three.module.js';
const MODE='platform', canvas=document.querySelector('#game'), scoreEl=document.querySelector('#score'), bestEl=document.querySelector('#best'), statusEl=document.querySelector('#status');
const renderer=new THREE.WebGLRenderer({canvas,antialias:true,alpha:false});renderer.setPixelRatio(Math.min(window.devicePixelRatio || 1, matchMedia('(max-width: 700px), (pointer: coarse)').matches ? 1.25 : 1.5));renderer.shadowMap.enabled=true;renderer.shadowMap.type=THREE.PCFSoftShadowMap;renderer.outputColorSpace=THREE.SRGBColorSpace;
const scene=new THREE.Scene();scene.background=new THREE.Color(MODE==='horror'?0x080b16:0x071321);scene.fog=new THREE.Fog(0x071321,18,42);
const camera=new THREE.PerspectiveCamera(55,1,.1,100);camera.position.set(0,15,19);camera.lookAt(0,0,0);
scene.add(new THREE.HemisphereLight(0xa8d9ff,0x172035,2));const sun=new THREE.DirectionalLight(0xffffff,2.2);sun.position.set(-7,14,8);sun.castShadow=true;scene.add(sun);
const mat=(color,emissive=0)=>new THREE.MeshStandardMaterial({color,roughness:.55,metalness:.18,emissive,emissiveIntensity:.5});
const floor=new THREE.Mesh(new THREE.PlaneGeometry(34,34),mat(0x12263a));floor.rotation.x=-Math.PI/2;floor.receiveShadow=true;scene.add(floor);const grid=new THREE.GridHelper(34,34,0x326080,0x203b55);grid.position.y=.012;scene.add(grid);
const geo={box:new THREE.BoxGeometry(1,1,1),sphere:new THREE.SphereGeometry(.5,18,14),cyl:new THREE.CylinderGeometry(.45,.5,1,12)};
let objects=[],enemies=[],projectiles=[],coins=[],player=null,running=false,paused=false,ended=false,score=0,best=+(localStorage.getItem('vf3d-'+MODE+'-best')||0),last=0,clock=0,hp=100,wave=0,credits=120;
bestEl.textContent=best;
function add(mesh,list=objects){mesh.castShadow=true;mesh.receiveShadow=true;scene.add(mesh);list.push(mesh);return mesh}
function cube(x,y,z,sx,sy,sz,color,list=objects){let m=new THREE.Mesh(geo.box,mat(color));m.position.set(x,y,z);m.scale.set(sx,sy,sz);return add(m,list)}
function ball(x,y,z,r,color,list=objects){let m=new THREE.Mesh(geo.sphere,mat(color,color));m.position.set(x,y,z);m.scale.setScalar(r*2);return add(m,list)}
function clear(list){for(const o of list)scene.remove(o);list.length=0}
function makePlayer(){player=new THREE.Group();const body=new THREE.Mesh(geo.box,mat(0x39cfff,0x087da8));body.scale.set(.75,1,.95);body.position.y=.65;player.add(body);const visor=new THREE.Mesh(geo.box,mat(0xc9f7ff));visor.scale.set(.48,.22,.08);visor.position.set(0,.82,-.49);player.add(visor);player.position.set(0,0,5);scene.add(player)}
function spawnEnemy(x,z,color=0xff6684,size=.7){let m=new THREE.Mesh(geo.sphere,mat(color,color));m.scale.setScalar(size);m.position.set(x,size,z);m.castShadow=true;scene.add(m);let e={mesh:m,hp:2,speed:1.5};enemies.push(e);return e}
function spawnCoin(x,z){let m=new THREE.Mesh(new THREE.TorusGeometry(.28,.09,8,18),mat(0xffd56a,0x9b6500));m.position.set(x,.75,z);m.rotation.x=Math.PI/2;scene.add(m);coins.push(m)}
function resize(){const w=canvas.clientWidth,h=canvas.clientHeight;renderer.setSize(w,h,false);camera.aspect=w/h;camera.updateProjectionMatrix()}new ResizeObserver(resize).observe(canvas);resize();
const keys={};function setKey(k,v){keys[k]=v}
window.addEventListener('keydown',e=>{const k=mapKey(e.key);if(k){e.preventDefault();setKey(k,true)}});window.addEventListener('keyup',e=>setKey(mapKey(e.key),false));
function mapKey(k){return ({ArrowUp:'up',w:'up',ArrowDown:'down',s:'down',ArrowLeft:'left',a:'left',ArrowRight:'right',d:'right',' ':'action',Enter:'action'})[k]||null}
document.querySelectorAll('[data-key]').forEach(b=>{const k=b.dataset.key;b.addEventListener('pointerdown',e=>{e.preventDefault();b.setPointerCapture(e.pointerId);setKey(k,true)});['pointerup','pointercancel','lostpointercapture'].forEach(ev=>b.addEventListener(ev,()=>setKey(k,false)))});
function setScore(v){score=v;scoreEl.textContent=Math.floor(score)}
function finish(){running=false;ended=true;statusEl.textContent='GAME OVER';if(score>best){best=Math.floor(score);localStorage.setItem('vf3d-'+MODE+'-best',best);bestEl.textContent=best}}
function setup(){
 if(player)scene.remove(player);
 clear(objects);clear(enemies);clear(projectiles);clear(coins);scene.children.filter(o=>o.userData.dynamic).forEach(o=>scene.remove(o));
 setScore(0);clock=0;hp=100;wave=0;credits=120;ended=false;paused=false;running=true;makePlayer();
 if(MODE==='race'){player.position.set(0,0,6);for(let i=0;i<8;i++)cube((Math.random()-.5)*8,.65,-i*4-5,1.15,1.3,1.6,0xffa34e,enemies).userData.speed=7+Math.random()*5;camera.position.set(0,11,16)}
 if(MODE==='tower'){player.position.set(0,0,7);player.visible=false;for(let i=0;i<6;i++)spawnEnemy((Math.random()-.5)*12,-10-i*3,0xff647e,.55);camera.position.set(0,18,14)}
 if(MODE==='platform'){player.position.set(-8,0,4);player.userData.vy=0;camera.position.set(0,9,18);for(let i=0;i<7;i++)cube(-7+i*2.4,-.25,2-i*.65,2.1,.5,2,0x28708a);for(let i=0;i<9;i++)spawnCoin(-7+i*1.8,1-i*.4)}
 if(MODE==='horror'){player.position.set(-7,0,7);camera.position.set(0,20,16);for(let i=0;i<8;i++)cube(-7+(i%4)*4,1,-6+Math.floor(i/4)*8,.35,2,3,0x27394d);for(let i=0;i<6;i++)spawnEnemy((Math.random()-.5)*14,(Math.random()-.5)*14,0xb72d58,.55);for(let i=0;i<7;i++)spawnCoin((Math.random()-.5)*14,(Math.random()-.5)*14)}
 if(MODE==='arena'){player.position.set(0,0,6);camera.position.set(0,16,19);for(let i=0;i<6;i++)spawnEnemy((Math.random()-.5)*13,-5-Math.random()*8,[0xff647e,0xffb44e,0xb58aff][i%3],.65)}
 camera.lookAt(0,0,0);statusEl.textContent='PLAYING';last=0;requestAnimationFrame(loop)
}
function shoot(from,to,color=0x57dfff){const m=new THREE.Mesh(new THREE.SphereGeometry(.13,10,8),mat(color,color));m.position.copy(from);scene.add(m);projectiles.push({mesh:m,dir:new THREE.Vector3().subVectors(to,from).normalize(),life:2,enemy:false})}
function update(dt){
 clock+=dt;
 const moveX=(keys.right?1:0)-(keys.left?1:0),moveZ=(keys.down?1:0)-(keys.up?1:0);
 if(MODE==='race'){player.position.x=THREE.MathUtils.clamp(player.position.x+moveX*9*dt,-4,4);player.position.z=6;enemies.forEach(e=>{e.position.z+=e.userData.speed*dt;if(e.position.z>10){e.position.z=-30-Math.random()*15;e.position.x=(Math.random()-.5)*8;setScore(score+10)}});if(enemies.some(e=>Math.abs(e.position.x-player.position.x)<1&&Math.abs(e.position.z-player.position.z)<1.3))finish();else setScore(score+dt*4)}
 if(MODE==='tower'){player.position.x=THREE.MathUtils.clamp(player.position.x+moveX*8*dt,-8,8);player.position.z=THREE.MathUtils.clamp(player.position.z+moveZ*8*dt,-8,8);if(keys.action&&!keys.actionUsed&&credits>=40){cube(player.position.x,.65,player.position.z,.8,1.3,.8,0x39d6ff);credits-=40;keys.actionUsed=true}if(!keys.action)keys.actionUsed=false;enemies.forEach(e=>{e.mesh.position.z+=e.speed*dt;if(e.mesh.position.z>9){finish()}});objects.filter(o=>o.geometry===geo.box).forEach(t=>{if(t.material.color&&t.material.color.getHex()===0x39d6ff){let target=enemies.find(e=>e.mesh.position.distanceTo(t.position)<5);if(target&&!target.cool){shoot(t.position.clone().add(new THREE.Vector3(0,1,0)),target.mesh.position,0x5be5ff);target.cool=true;setTimeout(()=>target.cool=false,450)}}});projectiles.forEach(p=>{let target=enemies.find(e=>e.mesh.position.distanceTo(p.mesh.position)<.7);if(target){target.hp--;p.life=0;if(target.hp<=0){scene.remove(target.mesh);enemies=enemies.filter(a=>a!==target);credits+=8;setScore(score+20)}}});if(!enemies.length){wave++;for(let i=0;i<5+wave*2;i++)spawnEnemy((Math.random()-.5)*14,-10-Math.random()*12,0xff647e,.55)}}
 if(MODE==='platform'){player.position.x=THREE.MathUtils.clamp(player.position.x+moveX*7*dt,-9,9);player.position.z=THREE.MathUtils.clamp(player.position.z+moveZ*5*dt,-7,7);player.userData.vy??=0;if(keys.action&&player.position.y<.05)player.userData.vy=8;player.userData.vy-=19*dt;player.position.y+=player.userData.vy*dt;if(player.position.y<0){player.position.y=0;player.userData.vy=0}coins=coins.filter(c=>{if(c.position.distanceTo(player.position)<1){scene.remove(c);setScore(score+25);return false}return true});if(player.position.x>8.5&&coins.length===0){setScore(score+100);finish()}if(player.position.y< -3)finish()}
 if(MODE==='horror'||MODE==='arena'){player.position.x=THREE.MathUtils.clamp(player.position.x+moveX*7*dt,-9,9);player.position.z=THREE.MathUtils.clamp(player.position.z+moveZ*7*dt,-9,9);enemies.forEach(e=>{let dir=new THREE.Vector3().subVectors(player.position,e.mesh.position);dir.y=0;let d=dir.length();if(d>.8)e.mesh.position.add(dir.normalize().multiplyScalar(e.speed*dt));if(d<.9)hp-=MODE==='horror'?17*dt:12*dt});if(keys.action&&clock-(player.userData.lastShot||0)>.25){let target=enemies.slice().sort((a,b)=>a.mesh.position.distanceTo(player.position)-b.mesh.position.distanceTo(player.position))[0];if(target){shoot(player.position.clone().add(new THREE.Vector3(0,1,0)),target.mesh.position);player.userData.lastShot=clock}}if(MODE==='horror'){coins=coins.filter(c=>{if(c.position.distanceTo(player.position)<1){scene.remove(c);setScore(score+30);hp=Math.min(100,hp+10);return false}return true});if(!coins.length){setScore(score+100);finish()}}else{projectiles.forEach(p=>{let hit=enemies.find(e=>e.mesh.position.distanceTo(p.mesh.position)<.75);if(hit){hit.hp--;p.life=0;if(hit.hp<=0){scene.remove(hit.mesh);enemies=enemies.filter(e=>e!==hit);setScore(score+50)}}});if(!enemies.length){wave++;for(let i=0;i<5+wave*2;i++)spawnEnemy((Math.random()-.5)*14,-8-Math.random()*5,0xff6c86,.65)}}if(hp<=0)finish()}
 projectiles=projectiles.filter(p=>{p.mesh.position.addScaledVector(p.dir,14*dt);p.life-=dt;if(p.life<=0){scene.remove(p.mesh);return false}return true});
 if(MODE!=='race'&&MODE!=='platform'&&player){player.rotation.y=Math.atan2(moveX,moveZ);player.children.forEach(c=>{c.rotation.z=0})}
}
function render(){renderer.render(scene,camera)}
function loop(t){if(!running)return;const dt=Math.min(.04,(t-last)/1000||0);last=t;if(!paused)update(dt);render();requestAnimationFrame(loop)}
document.querySelector('#start').onclick=setup;document.querySelector('#pause').onclick=()=>{if(!running)return;paused=!paused;statusEl.textContent=paused?'PAUSED':'PLAYING';if(!paused){last=0}};
if(MODE==='race')document.querySelector('#hint').textContent='← → steer • Avoid the traffic. Touch pad works on phones.';
if(MODE==='tower')document.querySelector('#hint').textContent='Move with the pad • ACTION places a turret (40 credits). Stop enemies reaching the base.';
if(MODE==='platform')document.querySelector('#hint').textContent='Move with the pad • ACTION jumps • Collect all sparks to unlock the exit.';
if(MODE==='horror')document.querySelector('#hint').textContent='Move with the pad • ACTION fires a pulse • Collect sparks and escape the shadows.';
if(MODE==='arena')document.querySelector('#hint').textContent='Move with the pad • ACTION fires • Survive the enemy waves.';
render();window.addEventListener('blur',()=>{Object.keys(keys).forEach(k=>keys[k]=false)});
</script></body></html>
