<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <meta name="description" content="VoidForge Studios YouTube to MP3 converter">
    <meta name="theme-color" content="#0b0b0f">

    <title>YT to MP3 | VoidForge Studios</title>

    <link rel="stylesheet" href="style.css">

    <style>
        .brand {
            display: inline-flex;
            align-items: center;
            gap: 0.65rem;
        }

        .brand-logo {
            width: 2.25rem;
            height: 2.75rem;
            object-fit: contain;
            filter: drop-shadow(0 0 0.8rem rgba(126, 92, 255, 0.45));
        }
    </style>
</head>

<body>
    <main class="container">
        <div class="brand" aria-label="VoidForge Studios">
            <img
                class="brand-logo"
                src="../assets/voidforge-mark.svg"
                alt="VoidForge Studios logo"
                width="99"
                height="120"
            >
            <span>VOIDFORGE STUDIOS</span>
        </div>

        <h1>YouTube <span>→</span> MP3</h1>

        <p class="subtitle">
            Paste a YouTube link and convert permitted content to MP3.
        </p>

        <form id="downloadForm">
            <label for="url" class="sr-only">YouTube URL</label>

            <input
                id="url"
                name="url"
                type="url"
                placeholder="https://www.youtube.com/watch?v=..."
                autocomplete="url"
                required
            >

            <button id="downloadButton" type="submit">
                <span>Download MP3</span>
            </button>
        </form>

        <p id="status" class="status" role="status" aria-live="polite"></p>

        <p class="notice">
            Only download content you have permission to download.
        </p>
    </main>

    <script src="static/script.js"></script>
</body>
</html>
