<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <meta name="description" content="VoidForge Studios YouTube to MP3 converter">
    <meta name="theme-color" content="#0b0b0f">

    <title>YT to MP3 | VoidForge Studios</title>

    <link rel="stylesheet" href="style.css">
</head>

<body>
    <main class="container">
        <div class="brand">VOIDFORGE STUDIOS</div>

        <h1>YouTube <span>→</span> MP3</h1>

        <p class="subtitle">
            Paste a YouTube link and convert permitted content to MP3.
        </p>

        <form id="downloadForm">
            <label for="url" class="sr-only">YouTube URL</label>

            <input
                id="url"
                name="url"
                type="url"
                placeholder="https://www.youtube.com/watch?v=..."
                autocomplete="url"
                required
            >

            <button id="downloadButton" type="submit">
                <span>Download MP3</span>
            </button>
        </form>

        <p id="status" class="status" role="status" aria-live="polite"></p>

        <p class="notice">
            Only download content you have permission to download.
        </p>
    </main>

    <script src="static/script.js"></script>
</body>
</html>
