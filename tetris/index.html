<!doctype html><html><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>VoidForge Tetris</title><style>body{margin:0;background:#0b0820;color:#fff;font:16px system-ui;text-align:center}canvas{background:#11102a;border:2px solid #6cf;margin:30px auto;display:block}button{padding:10px 18px;border:0;border-radius:8px}</style></head><body><h1>VoidForge Tetris</h1><p>Arrow keys: move • ↑ rotate • ↓ drop</p><canvas id=c width=300 height=600></canvas><script>const c=document.getElementById('c'),x=c.getContext('2d'),S=30,W=10,H=20,g=Array.from({length:H},()=>Array(W).fill(0));let p={x:3,y:0,m:[[1,1,1],[0,1,0]]},score=0;function rot(){p.m=p.m[0].map((_,i)=>p.m.map(r=>r[i]).reverse())}function hit(dx=0,dy=0){return p.m.some((r,y)=>r.some((v,x)=>v&&(g[p.y+y+dy]?.[p.x+x+dx]||p.x+x+dx<0||p.x+x+dx>=W||p.y+y+dy>=H)))}function merge(){p.m.forEach((r,y)=>r.forEach((v,x)=>{if(v)g[p.y+y][p.x+x]=1}));g=g.filter(r=>r.some(v=>!v));while(g.length<H)g.unshift(Array(W).fill(0));score+=100;newp()}function newp(){p={x:3,y:0,m:Math.random()<.5?[[1,1,1],[0,1,0]]:[[1,1],[1,1]]};if(hit())g.forEach(r=>r.fill(0))}function draw(){x.clearRect(0,0,300,600);g.forEach((r,y)=>r.forEach((v,z)=>{if(v){x.fillStyle='#5cf';x.fillRect(z*S,y*S,S-2,S-2)}}));p.m.forEach((r,y)=>r.forEach((v,z)=>{if(v){x.fillStyle='#f5c';x.fillRect((p.x+z)*S,(p.y+y)*S,S-2,S-2)}}));requestAnimationFrame(draw)}document.onkeydown=e=>{if(e.key==='ArrowLeft'&&!hit(-1))p.x--;if(e.key==='ArrowRight'&&!hit(1))p.x++;if(e.key==='ArrowDown'&&!hit(0,1))p.y++;if(e.key==='ArrowUp'){rot();if(hit())rot();rot();rot()}};setInterval(()=>{if(!hit(0,1))p.y++;else merge()},450);draw()</script></body></html>
