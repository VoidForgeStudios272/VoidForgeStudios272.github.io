<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover"><title>VoidForge Tetris</title><style>body{margin:0;min-height:100dvh;background:#0b0820;color:#fff;font:16px system-ui;text-align:center;touch-action:manipulation}canvas{width:min(76vw,300px);height:auto;max-height:58vh;background:#11102a;border:2px solid #6cf;margin:12px auto;display:block}.controls{display:grid;grid-template-columns:repeat(3,70px);gap:8px;justify-content:center;margin:10px auto 24px}.controls button{height:52px;border:0;border-radius:10px;background:#27204b;color:#fff;font-size:22px;touch-action:manipulation}.controls .rotate{grid-column:2}.controls .left{grid-column:1}.controls .down{grid-column:2}.controls .right{grid-column:3}</style></head><body><h1>VoidForge Tetris</h1><p>Touch controls or keyboard</p><canvas id=c width=300 height=600></canvas><div class=controls><button class=rotate data-a=rotate>↻</button><button class=left data-a=left>←</button><button class=down data-a=down>↓</button><button class=right data-a=right>→</button></div><script>const c=document.getElementById('c'),x=c.getContext('2d'),S=30,W=10,H=20,g=Array.from({length:H},()=>Array(W).fill(0));let p={x:3,y:0,m:[[1,1,1],[0,1,0]]},score=0;function rot(){p.m=p.m[0].map((_,i)=>p.m.map(r=>r[i]).reverse())}function hit(dx=0,dy=0){return p.m.some((r,y)=>r.some((v,x)=>v&&(g[p.y+y+dy]?.[p.x+x+dx]||p.x+x+dx<0||p.x+x+dx>=W||p.y+y+dy>=H)))}function merge(){p.m.forEach((r,y)=>r.forEach((v,x)=>{if(v)g[p.y+y][p.x+x]=1}));g.splice(0,g.length,...g.filter(r=>r.some(v=>!v)));while(g.length<H)g.unshift(Array(W).fill(0));score+=100;newp()}function newp(){p={x:3,y:0,m:Math.random()<.5?[[1,1,1],[0,1,0]]:[[1,1],[1,1]]};if(hit())g.forEach(r=>r.fill(0))}function act(a){if(a==='left'&&!hit(-1))p.x--;if(a==='right'&&!hit(1))p.x++;if(a==='down'&&!hit(0,1))p.y++;if(a==='rotate'){rot();if(hit()){rot();rot();rot()}}}function draw(){x.clearRect(0,0,300,600);g.forEach((r,y)=>r.forEach((v,z)=>{if(v){x.fillStyle='#5cf';x.fillRect(z*S,y*S,S-2,S-2)}}));p.m.forEach((r,y)=>r.forEach((v,z)=>{if(v){x.fillStyle='#f5c';x.fillRect((p.x+z)*S,(p.y+y)*S,S-2,S-2)}}));requestAnimationFrame(draw)}document.onkeydown=e=>{const a={ArrowLeft:'left',ArrowRight:'right',ArrowDown:'down',ArrowUp:'rotate'}[e.key];if(a){e.preventDefault();act(a)}};document.querySelectorAll('[data-a]').forEach(b=>b.onpointerdown=e=>{e.preventDefault();act(b.dataset.a)});setInterval(()=>{if(!hit(0,1))p.y++;else merge()},450);draw()</script></body></html>
