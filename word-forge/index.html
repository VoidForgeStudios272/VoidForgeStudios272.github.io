<!doctype html>
<html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Word Forge · VoidForge</title><style>
*{box-sizing:border-box}body{margin:0;min-height:100vh;background:radial-gradient(ellipse at 50% 0,#172d50,#080d17 65%);color:#eef4ff;font:15px system-ui;display:grid;place-items:center;padding:18px}.wrap{width:min(100%,480px);text-align:center}.brand{color:#8db8ff;font-size:11px;font-weight:800;letter-spacing:4px}h1{font-size:38px;letter-spacing:-2px;margin:5px 0}.sub{color:#9aacc5;margin:0 0 22px}.board{display:grid;gap:8px;justify-content:center;margin:0 auto 20px}.row{display:flex;gap:8px}.tile{width:clamp(48px,12vw,60px);height:clamp(48px,12vw,60px);border:2px solid #334760;border-radius:9px;display:grid;place-items:center;font-size:25px;font-weight:850;text-transform:uppercase;background:#101c2d}.tile.good{background:#287c60;border-color:#287c60}.tile.present{background:#a77a2e;border-color:#a77a2e}.tile.bad{background:#344256;border-color:#344256}.tile.filled{border-color:#759ed8}.keyboard{display:grid;gap:7px;margin:0 auto;max-width:440px}.keyrow{display:flex;justify-content:center;gap:5px}.key{height:48px;min-width:0;flex:1;border:0;border-radius:8px;background:#263a55;color:white;font-weight:750;font-size:13px;cursor:pointer}.key.wide{flex:1.5}.key.good{background:#287c60}.key.present{background:#a77a2e}.key.bad{background:#344256}.message{min-height:24px;color:#a9c9ff;margin:10px}.actions{display:flex;justify-content:center;gap:9px}.btn{border:0;border-radius:11px;padding:11px 16px;background:#397bd8;color:white;font-weight:750;cursor:pointer}
</style><style id="voidforge-mobile-compat">:root{color-scheme:dark}*,*::before,*::after{box-sizing:border-box}html{width:100%;min-width:0;min-height:100%;-webkit-text-size-adjust:100%;overscroll-behavior-x:none}body{width:100%;min-width:0;max-width:100%;min-height:100svh;overflow-x:hidden;padding-bottom:env(safe-area-inset-bottom)}img,svg,video,iframe,canvas{max-width:100%}canvas{touch-action:none;-webkit-user-select:none;user-select:none}button,[role="button"],input,select,textarea{font:inherit;touch-action:manipulation}button,[role="button"]{min-height:44px}:focus-visible{outline:2px solid #75baff;outline-offset:3px}@media(max-width:700px),(pointer:coarse){body{min-height:100dvh;padding-left:max(6px,env(safe-area-inset-left));padding-right:max(6px,env(safe-area-inset-right))}h1{font-size:clamp(21px,6vw,32px);overflow-wrap:anywhere}main,.app,.shell,.game,.container,.game-container,.gameContainer,.stage,.wrapper,.arena{width:100%;max-width:100%;min-width:0}canvas{max-width:100%;height:auto}button,[role="button"]{min-width:44px;min-height:46px}.controls,.pad,.actions,.mobile,.mobile-controls,#mobile,#mobileControls{max-width:100%;gap:8px;flex-wrap:wrap}.stats,.toolbar,.topbar,.header,.bottom,.bar{max-width:100%;flex-wrap:wrap}input,select,textarea{max-width:100%;min-width:0}}@media(orientation:landscape) and (max-height:520px){body{min-height:100dvh}.shell,.app,.game{padding-top:6px;padding-bottom:6px}}@media(prefers-reduced-motion:reduce){*,*::before,*::after{scroll-behavior:auto!important;animation-duration:.01ms!important;transition-duration:.01ms!important}}</style></head><body><main class="wrap"><div class="brand">VOIDFORGE • WORD PUZZLE</div><h1>WORD <span style="color:#80adff">FORGE</span></h1><p class="sub">Find the hidden five-letter word in six tries.</p><div class="board" id="board"></div><div class="message" id="message">Guess a five-letter word.</div><div class="keyboard" id="keyboard"></div><div class="actions"><button class="btn" id="new">New word</button></div></main><script>
const words=['PLANT','GHOST','FLAME','BRICK','CLOUD','PIXEL','QUEST','ROBOT','NIGHT','LASER','WORLD','SNAKE','STONE','BLAZE','SPACE','DREAM','CROWN','MUSIC','SHARD','NEXUS'];let answer,row,col,done,grid,states,board=document.querySelector('#board'),message=document.querySelector('#message'),keyboard=document.querySelector('#keyboard');
function init(){answer=words[Math.floor(Math.random()*words.length)];row=0;col=0;done=false;grid=Array.from({length:6},()=>Array(5).fill(''));states=Array.from({length:6},()=>Array(5).fill(''));message.textContent='Guess a five-letter word.';draw()}
function draw(){board.innerHTML='';for(let r=0;r<6;r++){let line=document.createElement('div');line.className='row';for(let k=0;k<5;k++){let tile=document.createElement('div');tile.className='tile '+states[r][k]+(grid[r][k]?' filled':'');tile.textContent=grid[r][k];line.append(tile)}board.append(line)}keyboard.innerHTML='';['QWERTYUIOP','ASDFGHJKL','ENTERZXCVBNM⌫'].forEach(str=>{let line=document.createElement('div');line.className='keyrow';let chars=str==='ENTERZXCVBNM⌫'?['ENTER',...'ZXCVBNM','⌫']:[...str];chars.forEach(ch=>{let b=document.createElement('button');b.className='key '+(['ENTER','⌫'].includes(ch)?'wide ':'')+(keyState(ch)||'');b.textContent=ch;b.onclick=()=>press(ch);line.append(b)});keyboard.append(line)})}
function keyState(ch){let s=[];for(let r=0;r<6;r++)for(let c=0;c<5;c++)if(grid[r][c]===ch&&states[r][c])s.push(states[r][c]);return s.includes('good')?'good':s.includes('present')?'present':s.includes('bad')?'bad':''}
function press(ch){if(done)return;if(ch==='⌫'||ch==='BACKSPACE'){if(col>0){col--;grid[row][col]=''}draw();return}if(ch==='ENTER'){submit();return}if(/^[A-Z]$/.test(ch)&&col<5){grid[row][col]=ch;col++;draw()}}
function submit(){if(col!==5){message.textContent='Enter all five letters first.';return}let guess=grid[row].join('');let counts={};for(let l of answer)counts[l]=(counts[l]||0)+1;for(let i=0;i<5;i++){let l=guess[i];if(l===answer[i]){states[row][i]='good';counts[l]--}}for(let i=0;i<5;i++){let l=guess[i];if(!states[row][i]){if(counts[l]>0){states[row][i]='present';counts[l]--}else states[row][i]='bad'}}if(guess===answer){done=true;message.textContent='Brilliant! You forged the word in '+(row+1)+' tries.'}else if(++row===6){done=true;message.textContent='The word was '+answer+'. Better luck next time.'}else{col=0;message.textContent='Keep going — '+(6-row)+' tries left.'}draw()}
document.addEventListener('keydown',e=>{if(e.key==='Enter')press('ENTER');else if(e.key==='Backspace')press('⌫');else if(/^[a-z]$/i.test(e.key))press(e.key.toUpperCase())});document.querySelector('#new').onclick=init;init();
</script></body></html>
