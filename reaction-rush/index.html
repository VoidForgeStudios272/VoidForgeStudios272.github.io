</style><style id="voidforge-mobile-compat">:root{color-scheme:dark}*,*::before,*::after{box-sizing:border-box}html{width:100%;min-width:0;min-height:100%;-webkit-text-size-adjust:100%;overscroll-behavior-x:none}body{width:100%;min-width:0;max-width:100%;min-height:100svh;overflow-x:hidden;padding-bottom:env(safe-area-inset-bottom)}img,svg,video,iframe,canvas{max-width:100%}canvas{touch-action:none;-webkit-user-select:none;user-select:none}button,[role="button"],input,select,textarea{font:inherit;touch-action:manipulation}button,[role="button"]{min-height:44px}:focus-visible{outline:2px solid #75baff;outline-offset:3px}@media(max-width:700px),(pointer:coarse){body{min-height:100dvh;padding-left:max(6px,env(safe-area-inset-left));padding-right:max(6px,env(safe-area-inset-right))}h1{font-size:clamp(21px,6vw,32px);overflow-wrap:anywhere}main,.app,.shell,.game,.container,.game-container,.gameContainer,.stage,.wrapper,.arena{width:100%;max-width:100%;min-width:0}canvas{max-width:100%;height:auto}button,[role="button"]{min-width:44px;min-height:46px}.controls,.pad,.actions,.mobile,.mobile-controls,#mobile,#mobileControls{max-width:100%;gap:8px;flex-wrap:wrap}.stats,.toolbar,.topbar,.header,.bottom,.bar{max-width:100%;flex-wrap:wrap}input,select,textarea{max-width:100%;min-width:0}}@media(orientation:landscape) and (max-height:520px){body{min-height:100dvh}.shell,.app,.game{padding-top:6px;padding-bottom:6px}}@media(prefers-reduced-motion:reduce){*,*::before,*::after{scroll-behavior:auto!important;animation-duration:.01ms!important;transition-duration:.01ms!important}}</style></head><body><main class="wrap"><div class="eyebrow">VOIDFORGE • SKILL TEST</div><h1>REACTION <span style="color:#80adff">RUSH</span></h1><p class="sub">Wait for green. Tap as fast as you can. Five rounds.</p><div class="stats"><div class="stat">ROUND<b id="round">0 / 5</b></div><div class="stat">AVERAGE<b id="avg">—</b></div><div class="stat">BEST<b id="best">—</b></div></div><div class="arena done" id="arena"><strong id="label">Press Start to begin</strong></div><button class="btn" id="start">Start test</button><div class="history" id="history">Your results will appear here.</div></main><script>
const arena=document.querySelector('#arena'),label=document.querySelector('#label'),roundEl=document.querySelector('#round'),avgEl=document.querySelector('#avg'),bestEl=document.querySelector('#best'),historyEl=document.querySelector('#history'),start=document.querySelector('#start');let phase='idle',timeout=null,goAt=0,results=[],round=0;function begin(){clearTimeout(timeout);results=[];round=0;next()}function next(){phase='wait';round++;roundEl.textContent=round+' / 5';avgEl.textContent=results.length?Math.round(results.reduce((a,b)=>a+b,0)/results.length)+' ms':'—';bestEl.textContent=results.length?Math.min(...results)+' ms':'—';arena.className='arena wait';label.textContent='Wait for green…';start.textContent='Restart test';timeout=setTimeout(()=>{if(phase!=='wait')return;phase='go';goAt=performance.now();arena.className='arena go';label.textContent='TAP NOW!'},900+Math.random()*2800)}arena.onclick=()=>{if(phase==='wait'){clearTimeout(timeout);phase='early';arena.className='arena done';label.textContent='Too early! Try this round again.';round--;roundEl.textContent=round+' / 5';return}if(phase==='go'){let ms=Math.round(performance.now()-goAt);results.push(ms);phase='result';arena.className='arena done';label.textContent=ms+' ms';historyEl.textContent='Rounds: '+results.join(' · ')+' ms';avgEl.textContent=Math.round(results.reduce((a,b)=>a+b,0)/results.length)+' ms';bestEl.textContent=Math.min(...results)+' ms';if(results.length===5){phase='finished';label.textContent='Test complete · '+avgEl.textContent+' average';start.textContent='Try again'}else{timeout=setTimeout(next,900)}}else if(phase==='early'){next()}};start.onclick=begin;
