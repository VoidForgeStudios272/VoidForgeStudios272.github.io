<!doctype html><html><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>VoidForge Asteroids</title><style>body{margin:0;background:#050511;color:white;text-align:center;font:16px system-ui}canvas{display:block;margin:15px auto;border:1px solid #5cf;background:#08081b}</style></head><body><h1>VoidForge Asteroids</h1><p>WASD/Arrows move • Space fire</p><canvas id=c width=700 height=500></canvas><script>const c=document.getElementById('c'),x=c.getContext('2d');let p={x:350,y:250,a:0,vx:0,vy:0},bul=[],rocks=Array.from({length:9},()=>({x:Math.random()*700,y:Math.random()*500,vx:Math.random()*2-1,vy:Math.random()*2-1,r:15+Math.random()*25})),k={};onkeydown=e=>k[e.key]=1;onkeyup=e=>k[e.key]=0;function loop(){x.clearRect(0,0,700,500);if(k.ArrowLeft||k.a)p.a-=.07;if(k.ArrowRight||k.d)p.a+=.07;if(k.ArrowUp||k.w){p.vx+=Math.cos(p.a)*.12;p.vy+=Math.sin(p.a)*.12}p.x=(p.x+p.vx+700)%700;p.y=(p.y+p.vy+500)%500;x.strokeStyle='#5cf';x.beginPath();x.moveTo(p.x+Math.cos(p.a)*18,p.y+Math.sin(p.a)*18);x.lineTo(p.x+Math.cos(p.a+2.5)*14,p.y+Math.sin(p.a+2.5)*14);x.lineTo(p.x+Math.cos(p.a-2.5)*14,p.y+Math.sin(p.a-2.5)*14);x.closePath();x.stroke();if(k[' ' ]&&(!loop.last||performance.now()-loop.last>180)){bul.push({x:p.x,y:p.y,vx:Math.cos(p.a)*7,vy:Math.sin(p.a)*7});loop.last=performance.now()}x.fillStyle='#fff';bul.forEach(b=>{b.x=(b.x+b.vx+700)%700;b.y=(b.y+b.vy+500)%500;x.fillRect(b.x,b.y,3,3)});x.strokeStyle='#f5c';rocks.forEach(r=>{r.x=(r.x+r.vx+700)%700;r.y=(r.y+r.vy+500)%500;x.beginPath();x.arc(r.x,r.y,r.r,0,7);x.stroke()});requestAnimationFrame(loop)}loop()</script></body></html>
