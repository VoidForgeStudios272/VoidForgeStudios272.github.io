<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover"><title>VoidForge Asteroids</title><style>body{margin:0;background:#050511;color:white;text-align:center;font:16px system-ui;touch-action:manipulation}canvas{display:block;width:min(94vw,700px);height:auto;margin:15px auto;border:1px solid #5cf;background:#08081b;touch-action:none}.controls{display:grid;grid-template-columns:repeat(3,64px);gap:8px;justify-content:center}.controls button{height:52px;border:0;border-radius:10px;background:#27204b;color:#fff;font-size:20px;touch-action:manipulation}.controls .fire{grid-column:2}.controls .left{grid-column:1}.controls .up{grid-column:2}.controls .right{grid-column:3}</style><style id="voidforge-mobile-compat">:root{color-scheme:dark}*,*::before,*::after{box-sizing:border-box}html{width:100%;min-width:0;min-height:100%;-webkit-text-size-adjust:100%;overscroll-behavior-x:none}body{width:100%;min-width:0;max-width:100%;min-height:100svh;overflow-x:hidden;padding-bottom:env(safe-area-inset-bottom)}img,svg,video,iframe,canvas{max-width:100%}canvas{touch-action:none;-webkit-user-select:none;user-select:none}button,[role="button"],input,select,textarea{font:inherit;touch-action:manipulation}button,[role="button"]{min-height:44px}:focus-visible{outline:2px solid #75baff;outline-offset:3px}@media(max-width:700px),(pointer:coarse){body{min-height:100dvh;padding-left:max(6px,env(safe-area-inset-left));padding-right:max(6px,env(safe-area-inset-right))}h1{font-size:clamp(21px,6vw,32px);overflow-wrap:anywhere}main,.app,.shell,.game,.container,.game-container,.gameContainer,.stage,.wrapper,.arena{width:100%;max-width:100%;min-width:0}canvas{max-width:100%;height:auto}button,[role="button"]{min-width:44px;min-height:46px}.controls,.pad,.actions,.mobile,.mobile-controls,#mobile,#mobileControls{max-width:100%;gap:8px;flex-wrap:wrap}.stats,.toolbar,.topbar,.header,.bottom,.bar{max-width:100%;flex-wrap:wrap}input,select,textarea{max-width:100%;min-width:0}}@media(orientation:landscape) and (max-height:520px){body{min-height:100dvh}.shell,.app,.game{padding-top:6px;padding-bottom:6px}}@media(prefers-reduced-motion:reduce){*,*::before,*::after{scroll-behavior:auto!important;animation-duration:.01ms!important;transition-duration:.01ms!important}}</style></head><body><h1>VoidForge Asteroids</h1><p>Touch controls or WASD/Arrows</p><canvas id=c width=700 height=500></canvas><div class=controls><button class=fire data-k=fire>●</button><button class=left data-k=left>↺</button><button class=up data-k=up>↑</button><button class=right data-k=right>↻</button></div><script>const c=document.getElementById('c'),x=c.getContext('2d');let p={x:350,y:250,a:0,vx:0,vy:0},bul=[],rocks=Array.from({length:9},()=>({x:Math.random()*700,y:Math.random()*500,vx:Math.random()*2-1,vy:Math.random()*2-1,r:15+Math.random()*25})),k={},THRUST=.12,ROT=.07,FIRE=180;onkeydown=e=>k[e.key]=1;onkeyup=e=>k[e.key]=0;document.querySelectorAll('[data-k]').forEach(b=>{b.onpointerdown=e=>{e.preventDefault();k[b.dataset.k]=1};b.onpointerup=b.onpointercancel=()=>k[b.dataset.k]=0});function loop(){x.clearRect(0,0,700,500);if(k.ArrowLeft||k.a||k.left)p.a-=ROT;if(k.ArrowRight||k.d||k.right)p.a+=ROT;if(k.ArrowUp||k.w||k.up){p.vx+=Math.cos(p.a)*THRUST;p.vy+=Math.sin(p.a)*THRUST}p.x=(p.x+p.vx+700)%700;p.y=(p.y+p.vy+500)%500;x.strokeStyle='#5cf';x.beginPath();x.moveTo(p.x+Math.cos(p.a)*18,p.y+Math.sin(p.a)*18);x.lineTo(p.x+Math.cos(p.a+2.5)*14,p.y+Math.sin(p.a+2.5)*14);x.lineTo(p.x+Math.cos(p.a-2.5)*14,p.y+Math.sin(p.a-2.5)*14);x.closePath();x.stroke();if(k[' ' ]||k.fire){if(!loop.last||performance.now()-loop.last>FIRE){bul.push({x:p.x,y:p.y,vx:Math.cos(p.a)*7,vy:Math.sin(p.a)*7});loop.last=performance.now()}}x.fillStyle='#fff';bul.forEach(b=>{b.x=(b.x+b.vx+700)%700;b.y=(b.y+b.vy+500)%500;x.fillRect(b.x,b.y,3,3)});x.strokeStyle='#f5c';rocks.forEach(r=>{r.x=(r.x+r.vx+700)%700;r.y=(r.y+r.vy+500)%500;x.beginPath();x.arc(r.x,r.y,r.r,0,7);x.stroke()});requestAnimationFrame(loop)}loop();window.addEventListener('voidforge:game-settings-change',e=>{const q=e.detail?.settings||{};if(q.thrust!==undefined)THRUST=Number(q.thrust);if(q.rotationSpeed!==undefined)ROT=Number(q.rotationSpeed);if(q.fireCooldown!==undefined)FIRE=Number(q.fireCooldown)});</script></body></html>
