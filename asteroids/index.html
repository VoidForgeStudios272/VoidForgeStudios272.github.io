<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover"><title>VoidForge Asteroids</title><style>body{margin:0;background:#050511;color:white;text-align:center;font:16px system-ui;touch-action:manipulation}canvas{display:block;width:min(94vw,700px);height:auto;margin:15px auto;border:1px solid #5cf;background:#08081b;touch-action:none}.controls{display:grid;grid-template-columns:repeat(3,64px);gap:8px;justify-content:center}.controls button{height:52px;border:0;border-radius:10px;background:#27204b;color:#fff;font-size:20px;touch-action:manipulation}.controls .fire{grid-column:2}.controls .left{grid-column:1}.controls .up{grid-column:2}.controls .right{grid-column:3}</style></head><body><h1>VoidForge Asteroids</h1><p>Touch controls or WASD/Arrows</p><canvas id=c width=700 height=500></canvas><div class=controls><button class=fire data-k=fire>●</button><button class=left data-k=left>↺</button><button class=up data-k=up>↑</button><button class=right data-k=right>↻</button></div><script>const c=document.getElementById('c'),x=c.getContext('2d');let p={x:350,y:250,a:0,vx:0,vy:0},bul=[],rocks=Array.from({length:9},()=>({x:Math.random()*700,y:Math.random()*500,vx:Math.random()*2-1,vy:Math.random()*2-1,r:15+Math.random()*25})),k={};onkeydown=e=>k[e.key]=1;onkeyup=e=>k[e.key]=0;document.querySelectorAll('[data-k]').forEach(b=>{b.onpointerdown=e=>{e.preventDefault();k[b.dataset.k]=1};b.onpointerup=b.onpointercancel=()=>k[b.dataset.k]=0});function loop(){x.clearRect(0,0,700,500);if(k.ArrowLeft||k.a||k.left)p.a-=.07;if(k.ArrowRight||k.d||k.right)p.a+=.07;if(k.ArrowUp||k.w||k.up){p.vx+=Math.cos(p.a)*.12;p.vy+=Math.sin(p.a)*.12}p.x=(p.x+p.vx+700)%700;p.y=(p.y+p.vy+500)%500;x.strokeStyle='#5cf';x.beginPath();x.moveTo(p.x+Math.cos(p.a)*18,p.y+Math.sin(p.a)*18);x.lineTo(p.x+Math.cos(p.a+2.5)*14,p.y+Math.sin(p.a+2.5)*14);x.lineTo(p.x+Math.cos(p.a-2.5)*14,p.y+Math.sin(p.a-2.5)*14);x.closePath();x.stroke();if(k[' ' ]||k.fire){if(!loop.last||performance.now()-loop.last>180){bul.push({x:p.x,y:p.y,vx:Math.cos(p.a)*7,vy:Math.sin(p.a)*7});loop.last=performance.now()}}x.fillStyle='#fff';bul.forEach(b=>{b.x=(b.x+b.vx+700)%700;b.y=(b.y+b.vy+500)%500;x.fillRect(b.x,b.y,3,3)});x.strokeStyle='#f5c';rocks.forEach(r=>{r.x=(r.x+r.vx+700)%700;r.y=(r.y+r.vy+500)%500;x.beginPath();x.arc(r.x,r.y,r.r,0,7);x.stroke()});requestAnimationFrame(loop)}loop()</script></body></html>
