<html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Tile Shift · VoidForge</title><style>
*{box-sizing:border-box}body{margin:0;min-height:100vh;display:grid;place-items:center;padding:18px;background:radial-gradient(ellipse at top,#1b3154,#080d17 65%);color:#eff5ff;font:15px system-ui}.wrap{width:min(100%,430px);text-align:center}.eyebrow{color:#8eb9ff;font-size:11px;font-weight:800;letter-spacing:3px}h1{font-size:40px;letter-spacing:-2px;margin:4px}.desc{color:#9bacc4;margin:0 0 18px}.stats{display:flex;justify-content:center;gap:12px;margin-bottom:14px}.stat{background:#ffffff0b;border:1px solid #ffffff1a;border-radius:11px;padding:9px 16px;color:#aabbd3}.stat b{display:block;color:white;font-size:18px}.board{display:grid;grid-template-columns:repeat(4,1fr);gap:8px;padding:10px;border-radius:18px;background:#0c1728;border:1px solid #49658a66;box-shadow:0 22px 60px #0007;touch-action:manipulation}.tile{aspect-ratio:1;border:0;border-radius:11px;background:linear-gradient(145deg,#315d94,#1b3962);color:white;font-size:clamp(20px,6vw,29px);font-weight:850;box-shadow:inset 0 1px #ffffff20;cursor:pointer}.tile.empty{background:#101b2b;box-shadow:inset 0 0 0 1px #ffffff0b;cursor:default}.tile:not(.empty):active{transform:scale(.96)}.actions{display:flex;gap:9px;margin-top:15px}.btn{flex:1;border:0;border-radius:11px;padding:13px;background:#397bd8;color:white;font-weight:750;cursor:pointer}.hint{color:#91a5c1;font-size:12px;margin-top:13px}
</style><style id="voidforge-mobile-compat">:root{color-scheme:dark}*,*::before,*::after{box-sizing:border-box}html{width:100%;min-width:0;min-height:100%;-webkit-text-size-adjust:100%;overscroll-behavior-x:none}body{width:100%;min-width:0;max-width:100%;min-height:100svh;overflow-x:hidden;padding-bottom:env(safe-area-inset-bottom)}img,svg,video,iframe,canvas{max-width:100%}canvas{touch-action:none;-webkit-user-select:none;user-select:none}button,[role="button"],input,select,textarea{font:inherit;touch-action:manipulation}button,[role="button"]{min-height:44px}:focus-visible{outline:2px solid #75baff;outline-offset:3px}@media(max-width:700px),(pointer:coarse){body{min-height:100dvh;padding-left:max(6px,env(safe-area-inset-left));padding-right:max(6px,env(safe-area-inset-right))}h1{font-size:clamp(21px,6vw,32px);overflow-wrap:anywhere}main,.app,.shell,.game,.container,.game-container,.gameContainer,.stage,.wrapper,.arena{width:100%;max-width:100%;min-width:0}canvas{max-width:100%;height:auto}button,[role="button"]{min-width:44px;min-height:46px}.controls,.pad,.actions,.mobile,.mobile-controls,#mobile,#mobileControls{max-width:100%;gap:8px;flex-wrap:wrap}.stats,.toolbar,.topbar,.header,.bottom,.bar{max-width:100%;flex-wrap:wrap}input,select,textarea{max-width:100%;min-width:0}}@media(orientation:landscape) and (max-height:520px){body{min-height:100dvh}.shell,.app,.game{padding-top:6px;padding-bottom:6px}}@media(prefers-reduced-motion:reduce){*,*::before,*::after{scroll-behavior:auto!important;animation-duration:.01ms!important;transition-duration:.01ms!important}}</style></head><body><main class="wrap"><div class="eyebrow">VOIDFORGE • LOGIC PUZZLE</div><h1>TILE <span style="color:#80adff">SHIFT</span></h1><p class="desc">Slide the tiles into order, from 1 to 15.</p><div class="stats"><div class="stat">MOVES<b id="moves">0</b></div><div class="stat">TIME<b id="time">0:00</b></div></div><div class="board" id="board"></div><div class="actions"><button class="btn" id="shuffle">Shuffle</button><button class="btn" id="reset">Reset</button></div><div class="hint" id="hint">Tap a tile next to the empty space to move it.</div></main><script>
const board=document.querySelector('#board'),movesEl=document.querySelector('#moves'),timeEl=document.querySelector('#time'),hint=document.querySelector('#hint');let a,moves=0,seconds=0,timer=null,started=false;function solved(){return a.every((v,i)=>v===(i===15?0:i+1))}function draw(){board.innerHTML='';a.forEach((v,i)=>{let b=document.createElement('button');b.className='tile'+(!v?' empty':'');b.textContent=v||'';b.setAttribute('aria-label',v?'Tile '+v:'Empty space');b.disabled=!v&&true;b.onclick=()=>move(i);board.append(b)});movesEl.textContent=moves;timeEl.textContent=Math.floor(seconds/60)+':'+String(seconds%60).padStart(2,'0')}
function move(i){let z=a.indexOf(0),r=Math.floor(i/4),c=i%4,zr=Math.floor(z/4),zc=z%4;if(Math.abs(r-zr)+Math.abs(c-zc)!==1)return;if(!started){started=true;timer=setInterval(()=>{seconds++;timeEl.textContent=Math.floor(seconds/60)+':'+String(seconds%60).padStart(2,'0')},1000)}[a[i],a[z]]=[a[z],a[i]];moves++;draw();if(solved()){clearInterval(timer);hint.textContent='Puzzle solved in '+moves+' moves and '+timeEl.textContent+'!';}}
function shuffle(){clearInterval(timer);timer=null;started=false;moves=0;seconds=0;a=Array.from({length:16},(_,i)=>i===15?0:i+1);let prev=-1;for(let n=0;n<260;n++){let z=a.indexOf(0),opts=[z-4,z+4,z%4?z-1:-1,z%4<3?z+1:-1].filter(i=>i>=0&&i<16&&Math.abs(Math.floor(i/4)-Math.floor(z/4))+Math.abs(i%4-z%4)===1&&i!==prev);let pick=opts[Math.floor(Math.random()*opts.length)];prev=z;[a[z],a[pick]]=[a[pick],a[z]]}if(solved())shuffle();hint.textContent='Tap a tile next to the empty space to move it.';draw()}
document.querySelector('#shuffle').onclick=shuffle;document.querySelector('#reset').onclick=()=>{if(!a)return;shuffle()};document.addEventListener('keydown',e=>{let z=a.indexOf(0),i={ArrowUp:z+4,ArrowDown:z-4,ArrowLeft:z%4?z+1:-1,ArrowRight:z%4<3?z-1:-1}[e.key];if(i!==undefined&&i>=0&&i<16){e.preventDefault();move(i)}});shuffle();
</script></body></html>
