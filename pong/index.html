</style></head><body><h1>VoidForge Pong</h1><p>Touch left/right side to move each paddle</p><canvas id=c width=800 height=450></canvas><small>Desktop: W/S and ↑/↓</small><script>c=document.querySelector('canvas'),x=c.getContext('2d'),a=175,b=175,X=400,Y=225,V=5,W=3,A=0,B=0,PS=6,k={};onkeydown=e=>k[e.key]=1;onkeyup=e=>k[e.key]=0;c.onpointermove=e=>{const r=c.getBoundingClientRect(),px=(e.clientX-r.left)/r.width*800,py=(e.clientY-r.top)/r.height*450;if(e.pointerType!=='mouse'){if(px<400)a=py-50;else b=py-50}};function f(){x.clearRect(0,0,800,450);x.fillStyle='#fff';x.fillRect(20,a,12,100);x.fillRect(768,b,12,100);x.beginPath();x.arc(X,Y,9,0,7);x.fill();x.font='40px system-ui';x.fillText(A,330,50);x.fillText(B,450,50);a=Math.max(0,Math.min(350,a+(k.w?-PS:k.s?PS:0)));b=Math.max(0,Math.min(350,b+(k.ArrowUp?-PS:k.ArrowDown?PS:0)));X+=V;Y+=W;if(Y<9||Y>441)W=-W;if(X<32&&Y>a&&Y<a+100)V=Math.abs(V)*1.02;if(X>759&&Y>b&&Y<b+100)V=-Math.abs(V)*1.02;if(X<0){B++;X=400}if(X>800){A++;X=400}requestAnimationFrame(f)}f();window.addEventListener('voidforge:game-settings-change',e=>{const q=e.detail?.settings||{};if(q.ballSpeed!==undefined){V=Math.sign(V||1)*Number(q.ballSpeed);W=Math.sign(W||1)*Number(q.ballSpeed)*.6}if(q.paddleSpeed!==undefined)PS=Number(q.paddleSpeed)});</script></body></html>
