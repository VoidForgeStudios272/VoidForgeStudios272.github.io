<!doctype html><html><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>VoidForge Memory</title><style>body{background:#0b0820;color:#fff;font:18px system-ui;text-align:center}.g{display:grid;grid-template-columns:repeat(4,70px);gap:8px;justify-content:center}.c{height:70px;font-size:30px;border:0;border-radius:10px;background:#28234d;color:white}</style></head><body><h1>VoidForge Memory</h1><div id=g class=g></div><p id=s>Find the pairs</p><script>let vals=['⚡','◆','★','☄','☯','✦','☀','⬟'],cards=[...vals,...vals].sort(()=>Math.random()-.5),open=[],lock=false,done=0;function draw(){g.innerHTML=cards.map((v,i)=>'<button class=c onclick="flip('+i+')">'+(open.includes(i)||cards[i]=='#'?' '+(cards[i]=='#'?'✓':v):'?')+'</button>').join('')}function flip(i){if(lock||open.includes(i)||cards[i]=='#')return;open.push(i);draw();if(open.length==2){lock=true;setTimeout(()=>{if(cards[open[0]]===cards[open[1]]){cards[open[0]]=cards[open[1]]='#';done+=2}else{}open=[];lock=false;s.textContent=done===cards.length?'All matched!':'Matches: '+done;draw()},500)}}draw()</script></body></html>
