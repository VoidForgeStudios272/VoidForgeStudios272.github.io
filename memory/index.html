ad><body><h1>VoidForge Memory</h1><div id=g class=g></div><p id=s>Find the pairs</p><script>let vals=['⚡','◆','★','☄','☯','✦','☀','⬟'],cards=[...vals,...vals].sort(()=>Math.random()-.5),open=[],lock=false,done=0,flipDelay=500,symbolTheme='classic';function draw(){g.innerHTML=cards.map((v,i)=>'<button class=c onclick="flip('+i+')">'+(open.includes(i)||cards[i]=='#'?' '+(cards[i]=='#'?'✓':v):'?')+'</button>').join('')}function flip(i){if(lock||open.includes(i)||cards[i]=='#')return;open.push(i);draw();if(open.length==2){lock=true;setTimeout(()=>{if(cards[open[0]]===cards[open[1]]){cards[open[0]]=cards[open[1]]='#';done+=2}else{}open=[];lock=false;s.textContent=done===cards.length?'All matched!':'Matches: '+done;draw()},flipDelay)}}draw();window.addEventListener('voidforge:game-settings-change',e=>{const q=e.detail?.settings||{};if(q.flipDelay!==undefined)flipDelay=Number(q.flipDelay);if(q.symbolTheme&&q.symbolTheme!==symbolTheme){symbolTheme=q.symbolTheme;const sets={classic:['⚡','◆','★','☄','☯','✦','☀','⬟'],space:['🚀','🪐','🌙','⭐','☄','👽','🛰️','🌌'],nature:['🌿','🌸','🍀','🌻','🌳','🍄','🌵','🌼']};const vals=sets[symbolTheme]||sets.classic;cards=[...vals,...vals].sort(()=>Math.random()-.5);open=[];lock=false;done=0;s.textContent='Find the pairs';draw()}})</script></body></html>
