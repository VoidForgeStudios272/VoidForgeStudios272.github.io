<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover"><title>VoidForge Breakout</title><style>body{margin:0;background:#080612;color:white;text-align:center;font:16px system-ui;touch-action:manipulation}canvas{display:block;width:min(94vw,700px);height:auto;margin:auto;background:#0d0920;touch-action:none}</style></head><body><h1>VoidForge Breakout</h1><p>Drag your finger to move the paddle</p><canvas id=c width=700 height=500></canvas><script>c=document.querySelector('canvas'),x=c.getContext('2d'),p=300,X=350,Y=450,V=4,W=-4,R=[];for(r=0;r<5;r++)for(q=0;q<9;q++)R.push([15+q*75,30+r*25,1]);onkeydown=e=>{if(e.key==='ArrowLeft')p-=30;if(e.key==='ArrowRight')p+=30};function setPaddle(e){const r=c.getBoundingClientRect();p=(e.clientX-r.left)/r.width*700-50}c.onpointermove=e=>setPaddle(e);c.onpointerdown=e=>setPaddle(e);function f(){x.clearRect(0,0,700,500);x.fillStyle='#fff';x.fillRect(p,475,100,12);x.beginPath();x.arc(X,Y,8,0,7);x.fill();R.forEach(z=>z[2]&&x.fillRect(z[0],z[1],65,16));p=Math.max(0,Math.min(600,p));X+=V;Y+=W;if(X<8||X>692)V=-V;if(Y<8)W=-W;if(Y>465&&X>p&&X<p+100)W=-Math.abs(W);R.forEach(z=>{if(z[2]&&X>z[0]&&X<z[0]+65&&Y>z[1]&&Y<z[1]+16){z[2]=0;W=-W}});if(Y>510){alert('Game over');location.reload()}requestAnimationFrame(f)}f()</script></body></html>
