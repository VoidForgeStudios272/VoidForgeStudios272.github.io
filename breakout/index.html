<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover"><title>VoidForge Breakout</title><style>body{margin:0;background:#080612;color:white;text-align:center;font:16px system-ui;touch-action:manipulation}canvas{display:block;width:min(94vw,700px);height:auto;margin:auto;background:#0d0920;touch-action:none}</style><style id="voidforge-mobile-compat">
/* Shared VoidForge mobile compatibility layer */
:root{color-scheme:dark}
*,*::before,*::after{box-sizing:border-box}
html{width:100%;min-width:0;min-height:100%;-webkit-text-size-adjust:100%;overscroll-behavior-x:none}
body{width:100%;min-width:0;max-width:100%;min-height:100svh;overflow-x:hidden;padding-bottom:env(safe-area-inset-bottom)}
img,svg,video,iframe,canvas{max-width:100%}
canvas{touch-action:none;-webkit-user-select:none;user-select:none}
button,[role="button"],input,select,textarea{font:inherit;touch-action:manipulation}
button,[role="button"]{min-height:44px}
:focus-visible{outline:2px solid #75baff;outline-offset:3px}
@media(max-width:700px),(pointer:coarse){
 body{min-height:100dvh;padding-left:max(6px,env(safe-area-inset-left));padding-right:max(6px,env(safe-area-inset-right))}
 h1{font-size:clamp(21px,6vw,32px);overflow-wrap:anywhere}
 main,.app,.shell,.game,.container,.game-container,.gameContainer,.stage,.wrapper,.arena{width:100%;max-width:100%;min-width:0}
 canvas{max-width:100%;height:auto}
 button,[role="button"]{min-width:44px;min-height:46px}
 .controls,.pad,.actions,.mobile,.mobile-controls,#mobile,#mobileControls{max-width:100%;gap:8px;flex-wrap:wrap}
 .stats,.toolbar,.topbar,.header,.bottom,.bar{max-width:100%;flex-wrap:wrap}
 input,select,textarea{max-width:100%;min-width:0}
}
@media(orientation:landscape) and (max-height:520px){
 body{min-height:100dvh}
 .shell,.app,.game{padding-top:6px;padding-bottom:6px}
}
@media(prefers-reduced-motion:reduce){*,*::before,*::after{scroll-behavior:auto!important;animation-duration:.01ms!important;transition-duration:.01ms!important}}
</style></head><body><h1>VoidForge Breakout</h1><p>Drag your finger to move the paddle</p><canvas id=c width=700 height=500></canvas><script>c=document.querySelector('canvas'),x=c.getContext('2d'),p=300,X=350,Y=450,V=4,W=-4,PS=30,R=[];for(r=0;r<5;r++)for(q=0;q<9;q++)R.push([15+q*75,30+r*25,1]);onkeydown=e=>{if(e.key==='ArrowLeft')p-=PS;if(e.key==='ArrowRight')p+=PS};function setPaddle(e){const r=c.getBoundingClientRect();p=(e.clientX-r.left)/r.width*700-50}c.onpointermove=e=>setPaddle(e);c.onpointerdown=e=>setPaddle(e);function f(){x.clearRect(0,0,700,500);x.fillStyle='#fff';x.fillRect(p,475,100,12);x.beginPath();x.arc(X,Y,8,0,7);x.fill();R.forEach(z=>z[2]&&x.fillRect(z[0],z[1],65,16));p=Math.max(0,Math.min(600,p));X+=V;Y+=W;if(X<8||X>692)V=-V;if(Y<8)W=-W;if(Y>465&&X>p&&X<p+100)W=-Math.abs(W);R.forEach(z=>{if(z[2]&&X>z[0]&&X<z[0]+65&&Y>z[1]&&Y<z[1]+16){z[2]=0;W=-W}});if(Y>510){alert('Game over');location.reload()}requestAnimationFrame(f)}f();window.addEventListener('voidforge:game-settings-change',e=>{const q=e.detail?.settings||{};if(q.ballSpeed!==undefined){V=Math.sign(V||1)*Number(q.ballSpeed);W=Math.sign(W||-1)*Number(q.ballSpeed)}if(q.paddleSpeed!==undefined)PS=Number(q.paddleSpeed)});</script></body></html>
