<!doctype html><meta name="viewport" content="width=device-width,initial-scale=1"><title>VoidForge Mines</title><style>body{background:#080612;color:white;text-align:center;font:16px system-ui}.g{display:grid;grid-template-columns:repeat(10,32px);gap:3px;justify-content:center}.g button{height:32px;background:#30284a;color:white;border:0}</style><h1>VoidForge Mines</h1><p>Clear the grid</p><div class=g id=g></div><script>g=document.querySelector('#g'),M=new Set;while(M.size<15)M.add(Math.floor(Math.random()*100));let C=[];for(i=0;i<100;i++){let b=document.createElement('button');b.onclick=()=>o(i);g.append(b);C[i]=b}function n(i){let r=i/10|0,q=i%10,a=[];for(y=-1;y<2;y++)for(z=-1;z<2;z++){R=r+y;Q=q+z;if(R>=0&&R<10&&Q>=0&&Q<10)a.push(R*10+Q)}return a}function o(i){if(C[i].disabled)return;C[i].disabled=1;if(M.has(i)){C[i].textContent='💣';M.forEach(j=>C[j].textContent='💣');return}let z=n(i).filter(j=>M.has(j)).length;C[i].textContent=z||'';if(!z)n(i).forEach(o)}</script>
