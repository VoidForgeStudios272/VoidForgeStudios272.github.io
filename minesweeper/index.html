<!doctype html>
<html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover"><title>VoidForge Mines</title>
<style>
:root{color-scheme:dark}*{box-sizing:border-box}body{margin:0;min-height:100dvh;background:#080612;color:#f6f4ff;text-align:center;font:16px system-ui;padding:24px 12px}
main{width:min(100%,560px);margin:auto}.meta{color:#a8a1c5}.board{display:grid;gap:4px;justify-content:center;margin:22px auto;width:max-content;max-width:100%}
.board button{width:clamp(24px,7vw,38px);aspect-ratio:1;border:1px solid #50466f;border-radius:6px;background:#30284a;color:#fff;font-weight:700;touch-action:manipulation}
.board button:disabled{background:#171326;border-color:#29213d}.board button.mine{background:#762f4d}
button.action{border:1px solid #65558f;border-radius:10px;background:#282044;color:#fff;padding:10px 16px;font:inherit}
</style><style id="voidforge-mobile-compat">:root{color-scheme:dark}*,*::before,*::after{box-sizing:border-box}html{width:100%;min-width:0;min-height:100%;-webkit-text-size-adjust:100%;overscroll-behavior-x:none}body{width:100%;min-width:0;max-width:100%;min-height:100svh;overflow-x:hidden;padding-bottom:env(safe-area-inset-bottom)}img,svg,video,iframe,canvas{max-width:100%}canvas{touch-action:none;-webkit-user-select:none;user-select:none}button,[role="button"],input,select,textarea{font:inherit;touch-action:manipulation}button,[role="button"]{min-height:44px}:focus-visible{outline:2px solid #75baff;outline-offset:3px}@media(max-width:700px),(pointer:coarse){body{min-height:100dvh;padding-left:max(6px,env(safe-area-inset-left));padding-right:max(6px,env(safe-area-inset-right))}h1{font-size:clamp(21px,6vw,32px);overflow-wrap:anywhere}main,.app,.shell,.game,.container,.game-container,.gameContainer,.stage,.wrapper,.arena{width:100%;max-width:100%;min-width:0}canvas{max-width:100%;height:auto}button,[role="button"]{min-width:44px;min-height:46px}.controls,.pad,.actions,.mobile,.mobile-controls,#mobile,#mobileControls{max-width:100%;gap:8px;flex-wrap:wrap}.stats,.toolbar,.topbar,.header,.bottom,.bar{max-width:100%;flex-wrap:wrap}input,select,textarea{max-width:100%;min-width:0}}@media(orientation:landscape) and (max-height:520px){body{min-height:100dvh}.shell,.app,.game{padding-top:6px;padding-bottom:6px}}@media(prefers-reduced-motion:reduce){*,*::before,*::after{scroll-behavior:auto!important;animation-duration:.01ms!important;transition-duration:.01ms!important}}</style></head><body><main><h1>VoidForge Mines</h1><p class="meta" id="status">Clear the grid without hitting a mine.</p><p id="counter" class="meta"></p><div class="board" id="board"></div><button class="action" id="restart">New game</button></main>
<script>
const board=document.getElementById("board"),statusText=document.getElementById("status"),counter=document.getElementById("counter");
let gridSize=10,mineCount=15,mines=new Set(),cells=[],ended=false,revealed=0;
function start(){
  ended=false;revealed=0;mines=new Set();cells=[];board.replaceChildren();
  const total=gridSize*gridSize,actual=Math.min(mineCount,total-1);
  while(mines.size<actual)mines.add(Math.floor(Math.random()*total));
  board.style.gridTemplateColumns="repeat("+gridSize+",clamp(24px,7vw,38px))";
  for(let i=0;i<total;i++){const cell=document.createElement("button");cell.type="button";cell.setAttribute("aria-label","Hidden cell "+(i+1));cell.addEventListener("click",()=>reveal(i));board.append(cell);cells.push(cell)}
  statusText.textContent="Clear the grid without hitting a mine.";counter.textContent=actual+" mines · "+gridSize+" × "+gridSize;
}
function neighbors(i){const r=Math.floor(i/gridSize),c=i%gridSize,out=[];for(let y=-1;y<=1;y++)for(let x=-1;x<=1;x++){const rr=r+y,cc=c+x;if(rr>=0&&rr<gridSize&&cc>=0&&cc<gridSize&&(x||y))out.push(rr*gridSize+cc)}return out}
function reveal(i){if(ended||cells[i].disabled)return;const cell=cells[i];cell.disabled=true;if(mines.has(i)){cell.textContent="💣";cell.classList.add("mine");mines.forEach(j=>{cells[j].textContent="💣";cells[j].disabled=true});ended=true;statusText.textContent="Game over — you hit a mine.";return}
  revealed++;const count=neighbors(i).filter(j=>mines.has(j)).length;cell.textContent=count||"";if(!count)neighbors(i).forEach(reveal);
  if(revealed===gridSize*gridSize-mines.size){ended=true;statusText.textContent="You cleared the field!";} }
document.getElementById("restart").addEventListener("click",start);
window.addEventListener("voidforge:game-settings-change",event=>{const q=event.detail?.settings||{};if(q.gridSize!==undefined)gridSize=Number(q.gridSize);if(q.mineCount!==undefined)mineCount=Number(q.mineCount);start()});
start();
</script></body></html>
