<!doctype html><html><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>VoidForge Tic-Tac-Toe</title><style>body{background:#0b0820;color:white;font:20px system-ui;text-align:center}.b{display:grid;grid-template-columns:repeat(3,90px);gap:8px;justify-content:center}.b button{height:90px;font-size:40px;border-radius:10px;border:0}</style><style id="voidforge-mobile-compat">:root{color-scheme:dark}*,*::before,*::after{box-sizing:border-box}html{width:100%;min-width:0;min-height:100%;-webkit-text-size-adjust:100%;overscroll-behavior-x:none}body{width:100%;min-width:0;max-width:100%;min-height:100svh;overflow-x:hidden;padding-bottom:env(safe-area-inset-bottom)}img,svg,video,iframe,canvas{max-width:100%}canvas{touch-action:none;-webkit-user-select:none;user-select:none}button,[role="button"],input,select,textarea{font:inherit;touch-action:manipulation}button,[role="button"]{min-height:44px}:focus-visible{outline:2px solid #75baff;outline-offset:3px}@media(max-width:700px),(pointer:coarse){body{min-height:100dvh;padding-left:max(6px,env(safe-area-inset-left));padding-right:max(6px,env(safe-area-inset-right))}h1{font-size:clamp(21px,6vw,32px);overflow-wrap:anywhere}main,.app,.shell,.game,.container,.game-container,.gameContainer,.stage,.wrapper,.arena{width:100%;max-width:100%;min-width:0}canvas{max-width:100%;height:auto}button,[role="button"]{min-width:44px;min-height:46px}.controls,.pad,.actions,.mobile,.mobile-controls,#mobile,#mobileControls{max-width:100%;gap:8px;flex-wrap:wrap}.stats,.toolbar,.topbar,.header,.bottom,.bar{max-width:100%;flex-wrap:wrap}input,select,textarea{max-width:100%;min-width:0}}@media(orientation:landscape) and (max-height:520px){body{min-height:100dvh}.shell,.app,.game{padding-top:6px;padding-bottom:6px}}@media(prefers-reduced-motion:reduce){*,*::before,*::after{scroll-behavior:auto!important;animation-duration:.01ms!important;transition-duration:.01ms!important}}</style></head><body><h1>VoidForge Tic-Tac-Toe</h1><div id=b class=b></div><p id=s></p><button onclick=reset()>Reset</button><script>let a=Array(9).fill(''),turn='X',firstTurn='X';function win(){return[[0,1,2],[3,4,5],[6,7,8],[0,3,6],[1,4,7],[2,5,8],[0,4,8],[2,4,6]].some(q=>q.every(i=>a[i]===turn))}function draw(){b.innerHTML=a.map((v,i)=>'<button onclick="go('+i+')">'+v+'</button>').join('')}function go(i){if(a[i]||win())return;a[i]=turn;if(win()||a.every(Boolean)){s.textContent=win()?turn+' wins!':'Draw!';draw();return}turn=turn==='X'?'O':'X';draw()}function reset(){a=Array(9).fill('');turn=firstTurn;s.textContent=firstTurn+' starts';draw()}reset();window.addEventListener('voidforge:game-settings-change',e=>{const q=e.detail?.settings||{};if(q.firstTurn){firstTurn=q.firstTurn;reset()}})</script></body></html>
