<!doctype html><html><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>VoidForge Tic-Tac-Toe</title><style>body{background:#0b0820;color:white;font:20px system-ui;text-align:center}.b{display:grid;grid-template-columns:repeat(3,90px);gap:8px;justify-content:center}.b button{height:90px;font-size:40px;border-radius:10px;border:0}</style></head><body><h1>VoidForge Tic-Tac-Toe</h1><div id=b class=b></div><p id=s></p><button onclick=reset()>Reset</button><script>let a=Array(9).fill(''),turn='X';function win(){return[[0,1,2],[3,4,5],[6,7,8],[0,3,6],[1,4,7],[2,5,8],[0,4,8],[2,4,6]].some(q=>q.every(i=>a[i]===turn))}function draw(){b.innerHTML=a.map((v,i)=>'<button onclick="go('+i+')">'+v+'</button>').join('')}function go(i){if(a[i]||win())return;a[i]=turn;if(win()||a.every(Boolean)){s.textContent=win()?turn+' wins!':'Draw!';draw();return}turn=turn==='X'?'O':'X';draw()}function reset(){a=Array(9).fill('');turn='X';s.textContent='X starts';draw()}reset()</script></body></html>
