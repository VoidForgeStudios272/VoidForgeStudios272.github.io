services:
  - type: web
    name: voidforge-among-us-backend
    runtime: node
    rootDir: among-us/backend
    buildCommand: npm ci
    startCommand: npm start
    healthCheckPath: /status
    envVars:
      - key: NODE_ENV
        value: production
      - key: ALLOWED_ORIGIN
        value: https://voidforgestudios272.github.io
