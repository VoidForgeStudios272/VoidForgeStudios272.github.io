<!doctype html>
<html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no"><title>Orbit Dodge · VoidForge</title><style>
*{box-sizing:border-box}body{margin:0;min-height:100vh;background:radial-gradient(ellipse at 50% 0,#172c50,#070c16 65%);color:#eef5ff;font:15px system-ui;display:grid;place-items:center;padding:18px}.game{width:min(100%,760px)}header{display:flex;justify-content:space-between;align-items:center;margin-bottom:14px}h1{font-size:clamp(24px,5vw,38px);margin:0;letter-spacing:-1.5px}h1 span{color:#79adff}.stats{display:flex;gap:10px}.stat{padding:9px 13px;border:1px solid #ffffff20;background:#ffffff09;border-radius:12px;color:#9fb4d3}.stat b{display:block;color:#fff;font-size:19px}canvas{display:block;width:100%;aspect-ratio:16/10;background:#080f1d;border:1px solid #5278aa55;border-radius:20px;box-shadow:0 25px 70px #0008;touch-action:none}.bar{display:flex;justify-content:space-between;align-items:center;gap:12px;margin-top:14px;color:#9fb4d3;font-size:13px}.btn{border:0;border-radius:12px;padding:12px 18px;background:linear-gradient(135deg,#65a2ff,#326bd0);color:white;font-weight:750;cursor:pointer}.pad{display:flex;justify-content:center;gap:14px;margin-top:14px}.pad button{width:68px;height:52px;border:1px solid #8eb8ff44;border-radius:14px;background:#162b49;color:white;font-size:22px;touch-action:none}@media(min-width:700px){.pad{display:none}}
</style></head><body><main class="game"><header><div><h1>ORBIT <span>DODGE</span></h1><small style="color:#8da6c8">Avoid the incoming energy gates</small></div><div class="stats"><div class="stat">SCORE<b id="score">0</b></div><div class="stat">BEST<b id="best">0</b></div></div></header><canvas id="c" width="800" height="500" aria-label="Orbit Dodge game area"></canvas><div class="bar"><span id="msg">Move with ← → or A / D. Touch the controls on mobile.</span><button class="btn" id="start">Start game</button></div><div class="pad"><button id="left">←</button><button id="right">→</button></div></main><script>
const c=document.querySelector('#c'),x=c.getContext('2d'),scoreEl=document.querySelector('#score'),bestEl=document.querySelector('#best'),msg=document.querySelector('#msg'),start=document.querySelector('#start');let player,blocks,score,best=+(localStorage.orbitBest||0),running=false,last=0,spawn=0,keys={};bestEl.textContent=best;
function reset(){player={x:400,y:435,r:15};blocks=[];score=0;spawn=0;scoreEl.textContent=0;running=true;last=0;start.textContent='Restart';msg.textContent='Stay alive and dodge the gates!';requestAnimationFrame(loop)}
function move(dir){if(running)player.x=Math.max(22,Math.min(778,player.x+dir*24))}
onkeydown=e=>{if(['ArrowLeft','ArrowRight','a','d','A','D'].includes(e.key)){e.preventDefault();keys[e.key.toLowerCase()]=true}if(e.key===' '&&!running)reset()};onkeyup=e=>keys[e.key.toLowerCase()]=false;
[['left',-1],['right',1]].forEach(([id,d])=>{let b=document.getElementById(id);b.onpointerdown=e=>{e.preventDefault();keys[d<0?'left':'right']=true};['pointerup','pointerleave','pointercancel'].forEach(t=>b.addEventListener(t,()=>keys[d<0?'left':'right']=false))});
c.addEventListener('pointermove',e=>{if(!running||e.buttons===0)return;const r=c.getBoundingClientRect();player.x=(e.clientX-r.left)/r.width*800});
function loop(t){if(!running)return;let dt=Math.min((t-last)/16.67||1,2);last=t;if(keys.arrowleft||keys.a||keys.left)move(-1);if(keys.arrowright||keys.d||keys.right)move(1);spawn+=dt;if(spawn>Math.max(20,54-score*.12)){spawn=0;let gap=110+Math.random()*65,center=90+Math.random()*620;blocks.push({y:-35,gap,center,h:24,speed:3+Math.min(5,score/100)})}x.clearRect(0,0,800,500);let bg=x.createLinearGradient(0,0,0,500);bg.addColorStop(0,'#101f38');bg.addColorStop(1,'#080e1a');x.fillStyle=bg;x.fillRect(0,0,800,500);x.strokeStyle='#8db9ff12';for(let i=0;i<12;i++){x.beginPath();x.moveTo(i*75,0);x.lineTo(i*75,500);x.stroke()}blocks.forEach(b=>{b.y+=b.speed*dt;x.fillStyle='#ff668c';x.shadowColor='#ff426d';x.shadowBlur=18;x.fillRect(0,b.y,b.center-b.gap/2,b.h);x.fillRect(b.center+b.gap/2,b.y,800,b.h);x.shadowBlur=0;if(player.y+player.r>b.y&&player.y-player.r<b.y+b.h&&(player.x-player.r<b.center-b.gap/2||player.x+player.r>b.center+b.gap/2))end()});blocks=blocks.filter(b=>b.y<530);if(!running)return;score+=dt*.18;scoreEl.textContent=Math.floor(score);x.beginPath();x.arc(player.x,player.y,player.r,0,Math.PI*2);x.fillStyle='#a9d0ff';x.shadowColor='#63a5ff';x.shadowBlur=25;x.fill();x.shadowBlur=0;x.beginPath();x.arc(player.x,player.y,5,0,Math.PI*2);x.fillStyle='#fff';x.fill();requestAnimationFrame(loop)}
function end(){running=false;best=Math.max(best,Math.floor(score));localStorage.orbitBest=best;bestEl.textContent=best;msg.textContent='Game over · You scored '+Math.floor(score);start.textContent='Play again'}start.onclick=reset;
</script></body></html>
