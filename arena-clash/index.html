<!doctype html>
<html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no"><meta name="theme-color" content="#080d19"><title>Arena Clash | VoidForge</title>
<style>
*{box-sizing:border-box}body{margin:0;background:#080d19;color:#eef4ff;font:15px system-ui, sans-serif;min-height:100vh;display:grid;place-items:center;padding:18px}.shell{width:min(100%,960px);background:#101a2b;border:1px solid #263b59;border-radius:22px;padding:20px;box-shadow:0 24px 80px #0008}.top{display:flex;align-items:center;justify-content:space-between;gap:12px;flex-wrap:wrap}h1{font-size:clamp(22px,4vw,34px);margin:0}.sub{color:#9fb2ce;margin:4px 0 16px}.stats{display:flex;gap:10px;flex-wrap:wrap}.stat{background:#0a1322;border:1px solid #263b59;border-radius:12px;padding:8px 12px;color:#9fb2ce}.stat b{color:#fff;margin-left:5px}canvas{display:block;width:100%;height:auto;aspect-ratio:16/9;background:#07101d;border:1px solid #2a4263;border-radius:14px;touch-action:none}.controls{display:flex;justify-content:space-between;align-items:center;gap:12px;flex-wrap:wrap;margin-top:14px;color:#9fb2ce}.buttons{display:flex;gap:8px;flex-wrap:wrap}button{background:#1d3555;border:1px solid #41658f;color:white;padding:10px 15px;border-radius:10px;font:inherit;cursor:pointer}button:hover{background:#294a72}.pad{display:none;gap:8px;justify-content:center;margin-top:12px}.pad button{min-width:54px;min-height:48px;font-size:19px}@media(max-width:650px){body{padding:8px}.shell{padding:13px;border-radius:16px}.pad{display:flex}.sub{font-size:13px}}
</style></head><body><main class="shell"><div class="top"><div><h1>Arena Clash</h1><p class="sub">VOIDFORGE ARCADE • Single-player</p></div><div class="stats"><div class="stat">SCORE <b id="score">0</b></div><div class="stat">BEST <b id="best">0</b></div><div class="stat">STATUS <b id="status">READY</b></div></div></div><canvas id="game" width="960" height="540" aria-label="Game canvas"></canvas><div class="controls"><span id="help">Use keyboard or touch controls to play.</span><div class="buttons"><button id="start">Start / Restart</button><button id="pause">Pause</button></div></div><div class="pad" id="pad"><button data-key="left">◀</button><button data-key="up">▲</button><button data-key="down">▼</button><button data-key="right">▶</button><button data-key="action">●</button></div></main>
<script>
(function(){
'use strict';
const MODE='arena', c=document.getElementById('game'),x=c.getContext('2d'),scoreEl=document.getElementById('score'),bestEl=document.getElementById('best'),statusEl=document.getElementById('status'),help=document.getElementById('help');
const keys={},W=960,H=540;let running=false,paused=false,over=false,score=0,best=Number(localStorage.getItem('vf-'+MODE+'-best')||0),last=0,elapsed=0,entities=[],player={},shots=[],effects=[],wave=1,health=3,frame=0;
bestEl.textContent=best;
const rand=(a,b)=>a+Math.random()*(b-a),clamp=(v,a,b)=>Math.max(a,Math.min(b,v));
const colors=['#42d9ff','#ffbf5f','#a88cff','#ff668c','#6ee7a8'];
function reset(){score=0;elapsed=0;frame=0;wave=1;health=3;entities=[];shots=[];effects=[];over=false;paused=false;player={x:W/2,y:H*.78,vx:0,vy:0,r:17};scoreEl.textContent='0';statusEl.textContent='PLAYING';running=true;last=0;
 if(MODE==='tower'){player.money=120;player.towers=[];player.lives=12;player.wave=0;spawnWave();}
 if(MODE==='horror'){player.battery=100;player.fuse=0;player.keys=0;player.x=70;player.y=70;for(let i=0;i<8;i++)entities.push({x:rand(120,880),y:rand(100,470),r:13,speed:rand(35,58),type:'ghost'});for(let i=0;i<5;i++)entities.push({x:rand(100,900),y:rand(100,480),r:9,type:'shard'});}
 if(MODE==='arena'){player.hp=100;player.cool=0;for(let i=0;i<6;i++)entities.push({x:rand(100,860),y:rand(100,440),r:15,hp:3,c:colors[i%5],cool:rand(0,1)});}
 if(MODE==='race'){player.x=480;player.y=430;player.speed=0;player.lane=0;for(let i=0;i<8;i++)entities.push({x:rand(350,610),y:-i*130-40,w:rand(34,48),h:70,s:rand(180,280)});}
 if(MODE==='platform'){player.x=80;player.y=400;player.vx=0;player.vy=0;player.grounded=false;player.coins=0;player.hp=3;entities=[{x:0,y:490,w:960,h:50},{x:170,y:410,w:150,h:18},{x:390,y:340,w:145,h:18},{x:620,y:270,w:150,h:18},{x:820,y:420,w:140,h:18}];for(let i=0;i<8;i++)shots.push({x:210+i*90,y:rand(220,380),r:8,coin:true});}
}
function spawnWave(){player.wave++;for(let i=0;i<5+player.wave*2;i++)entities.push({x:rand(60,900),y:-rand(30,400),r:12,hp:1+Math.floor(player.wave/3),speed:35+player.wave*7});}
function drawBg(){x.fillStyle='#07101d';x.fillRect(0,0,W,H);x.strokeStyle='#12243a';x.lineWidth=1;for(let i=0;i<W;i+=48){x.beginPath();x.moveTo(i,0);x.lineTo(i,H);x.stroke()}for(let i=0;i<H;i+=48){x.beginPath();x.moveTo(0,i);x.lineTo(W,i);x.stroke()}}
function circle(o,color){x.fillStyle=color;x.beginPath();x.arc(o.x,o.y,o.r,0,Math.PI*2);x.fill()}
function finish(){running=false;over=true;statusEl.textContent='GAME OVER';if(score>best){best=score;localStorage.setItem('vf-'+MODE+'-best',best);bestEl.textContent=best}}
function update(dt){frame++;elapsed+=dt;
 if(MODE==='race'){let steer=(keys.left?-1:0)+(keys.right?1:0);player.x=clamp(player.x+steer*330*dt,300,660);player.speed=clamp(player.speed+((keys.up?1:keys.down?-1:0)-.2)*180*dt,100,390);entities.forEach(e=>{e.y+= (e.s+player.speed*.35)*dt;if(e.y>H+80){e.y=-100;e.x=rand(350,610);score+=10}});for(const e of entities){if(Math.abs(e.x-player.x)<42&&Math.abs(e.y-player.y)<65)finish()}score+=Math.floor(dt*player.speed/25)}
 if(MODE==='tower'){if(keys.action){let gx=Math.round(player.x/60)*60,gy=Math.round(player.y/60)*60;if(player.money>=40&&!player.towers.some(t=>t.x===gx&&t.y===gy)){player.towers.push({x:gx,y:gy,cool:0});player.money-=40}keys.action=false}player.x=clamp(player.x+(keys.left?-1:keys.right?1:0)*250*dt,30,930);player.y=clamp(player.y+(keys.up?-1:keys.down?1:0)*250*dt,30,510);entities.forEach(e=>{e.y+=e.speed*dt;if(e.y>H){e.dead=true;player.lives--;}});player.towers.forEach(t=>{t.cool-=dt;if(t.cool<=0){let target=entities.find(e=>!e.dead&&Math.hypot(e.x-t.x,e.y-t.y)<190);if(target){target.hp--;t.cool=.45;if(target.hp<=0){target.dead=true;score+=15;player.money+=8}}}});entities=entities.filter(e=>!e.dead);if(!entities.length)spawnWave();if(player.lives<=0)finish()}
 if(MODE==='platform'){player.vx=((keys.left?-1:0)+(keys.right?1:0))*260;player.x=clamp(player.x+player.vx*dt,15,945);if(keys.action&&player.grounded){player.vy=-540;player.grounded=false}player.vy+=1100*dt;let oldY=player.y;player.y+=player.vy*dt;player.grounded=false;for(const p of entities){if(player.x+12>p.x&&player.x-12<p.x+p.w&&oldY+18<=p.y&&player.y+18>=p.y&&player.vy>=0){player.y=p.y-18;player.vy=0;player.grounded=true}}shots=shots.filter(s=>{if(Math.hypot(s.x-player.x,s.y-player.y)<23){score+=25;return false}return true});if(player.y>H+40||player.hp<=0)finish();if(player.x>915&&player.y<470){score+=100;finish()}}
 if(MODE==='horror'){let dx=(keys.right?1:0)-(keys.left?1:0),dy=(keys.down?1:0)-(keys.up?1:0),m=Math.hypot(dx,dy)||1;player.x=clamp(player.x+dx/m*145*dt,18,942);player.y=clamp(player.y+dy/m*145*dt,18,522);player.battery-=dt*1.3;if(player.battery<=0)finish();entities.filter(e=>e.type==='ghost').forEach(e=>{let d=Math.hypot(player.x-e.x,player.y-e.y)||1;e.x+=((player.x-e.x)/d)*e.speed*dt;e.y+=((player.y-e.y)/d)*e.speed*dt;if(d<25){player.battery-=18*dt}});entities=entities.filter(e=>{if(e.type==='shard'&&Math.hypot(player.x-e.x,player.y-e.y)<24){score+=30;player.battery=Math.min(100,player.battery+18);return false}return true});if(!entities.some(e=>e.type==='shard')){score+=100;finish()}}
 if(MODE==='arena'){let dx=(keys.right?1:0)-(keys.left?1:0),dy=(keys.down?1:0)-(keys.up?1:0),m=Math.hypot(dx,dy)||1;player.x=clamp(player.x+dx/m*230*dt,20,940);player.y=clamp(player.y+dy/m*230*dt,20,520);player.cool-=dt;if((keys.action||keys.space)&&player.cool<=0){shots.push({x:player.x,y:player.y-20,vy:-440,r:5,enemy:false});player.cool=.22}shots.forEach(s=>s.y+=s.vy*dt);entities.forEach(e=>{let d=Math.hypot(player.x-e.x,player.y-e.y)||1;e.x+=((player.x-e.x)/d)*55*dt;e.y+=((player.y-e.y)/d)*55*dt;e.cool-=dt;if(e.cool<=0){shots.push({x:e.x,y:e.y+10,vy:210,r:5,enemy:true});e.cool=rand(.8,1.7)}if(d<28)player.hp-=12*dt});shots=shots.filter(s=>{if(s.enemy){if(Math.hypot(s.x-player.x,s.y-player.y)<20)player.hp-=12;return s.y<H+20}let hit=entities.find(e=>Math.hypot(s.x-e.x,s.y-e.y)<20);if(hit){hit.hp--;if(hit.hp<=0){entities=entities.filter(a=>a!==hit);score+=50}return false}return s.y>-20});if(!entities.length){score+=200;for(let i=0;i<6;i++)entities.push({x:rand(100,860),y:rand(80,450),r:15,hp:3+Math.floor(score/250),c:colors[i%5],cool:rand(0,1)})}if(player.hp<=0)finish()}
 scoreEl.textContent=score;
}
function render(){drawBg();
 if(MODE==='race'){x.fillStyle='#172b40';x.fillRect(300,0,360,H);x.strokeStyle='#d3e5f4';x.setLineDash([30,24]);x.lineWidth=5;x.beginPath();x.moveTo(480,0);x.lineTo(480,H);x.stroke();x.setLineDash([]);entities.forEach(e=>{x.fillStyle='#ffb45f';x.fillRect(e.x-e.w/2,e.y,e.w,e.h)});x.fillStyle='#42d9ff';x.fillRect(player.x-18,player.y-30,36,60);x.fillStyle='#fff';x.fillRect(player.x-12,player.y-22,24,8);x.fillStyle='#9fb2ce';x.fillText('SPEED '+Math.round(player.speed||0),22,30)}
 if(MODE==='tower'){entities.forEach(e=>circle(e,'#ff647d'));(player.towers||[]).forEach(t=>{x.fillStyle='#42d9ff';x.fillRect(t.x-13,t.y-13,26,26)});x.strokeStyle='#42d9ff';x.beginPath();x.arc(player.x,player.y,12,0,7);x.stroke();x.fillStyle='#fff';x.fillText('Credits: '+player.money+'  •  Lives: '+player.lives+'  •  Wave: '+player.wave,20,28)}
 if(MODE==='platform'){entities.forEach(p=>{x.fillStyle='#315b75';x.fillRect(p.x,p.y,p.w,p.h)});shots.forEach(s=>circle(s,'#ffd166'));x.fillStyle='#42d9ff';x.fillRect(player.x-13,player.y-18,26,36);x.fillStyle='#fff';x.fillText('Collect the sparks • Reach the glowing exit on the right',20,28);x.fillStyle='#6ee7a8';x.fillRect(920,420,12,70)}
 if(MODE==='horror'){x.fillStyle='#1a2940';x.fillRect(35,35,890,470);x.fillStyle='#0d1727';for(let i=0;i<7;i++)x.fillRect(130+i*105,80+(i%2)*190,28,190);entities.forEach(e=>circle(e,e.type==='ghost'?'#e34c70':'#ffe27a'));circle(player,'#42d9ff');x.fillStyle='#fff';x.fillText('BATTERY '+Math.max(0,Math.floor(player.battery))+'%  •  Collect every yellow spark and avoid the shadows',20,25);x.fillStyle='#263b59';x.fillRect(20,38,180,8);x.fillStyle='#ffe27a';x.fillRect(20,38,180*clamp(player.battery/100,0,1),8)}
 if(MODE==='arena'){entities.forEach(e=>{circle(e,e.c);x.fillStyle='#fff';x.fillRect(e.x-12,e.y-23,24,3);x.fillStyle='#ff668c';x.fillRect(e.x-12,e.y-23,24*e.hp/4,3)});shots.forEach(s=>circle(s,s.enemy?'#ff668c':'#42d9ff'));circle(player,'#42d9ff');x.fillStyle='#fff';x.fillText('HP '+Math.max(0,Math.ceil(player.hp))+'  •  Clear the arena waves',20,25);x.fillStyle='#263b59';x.fillRect(20,38,180,8);x.fillStyle='#6ee7a8';x.fillRect(20,38,180*clamp(player.hp/100,0,1),8)}
 if(!running){x.fillStyle='#06101dcc';x.fillRect(0,0,W,H);x.textAlign='center';x.fillStyle='#fff';x.font='bold 34px system-ui';x.fillText(over?'RUN ENDED':'READY TO PLAY',W/2,H/2-8);x.font='18px system-ui';x.fillStyle='#a9bfdc';x.fillText(over?'Press Start to try again':'Press Start to begin',W/2,H/2+30);x.textAlign='left'}
}
function loop(t){if(!running)return;let dt=Math.min(.035,(t-last)/1000||0);last=t;if(!paused)update(dt);render();requestAnimationFrame(loop)}
function start(){reset();requestAnimationFrame(loop)}
document.getElementById('start').onclick=start;document.getElementById('pause').onclick=()=>{if(!running)return;paused=!paused;statusEl.textContent=paused?'PAUSED':'PLAYING';if(!paused){last=0;requestAnimationFrame(loop)}};
window.addEventListener('keydown',e=>{let k=e.key.toLowerCase();if(['arrowup','arrowdown','arrowleft','arrowright',' '].includes(k))e.preventDefault();keys[{arrowup:'up',w:'up',arrowdown:'down',s:'down',arrowleft:'left',a:'left',arrowright:'right',d:'right',' ':'action',enter:'action'}[k]||k]=true});
window.addEventListener('keyup',e=>{let k=e.key.toLowerCase();keys[{arrowup:'up',w:'up',arrowdown:'down',s:'down',arrowleft:'left',a:'left',arrowright:'right',d:'right',' ':'action',enter:'action'}[k]||k]=false});
document.querySelectorAll('[data-key]').forEach(b=>{let k=b.dataset.key;b.addEventListener('pointerdown',e=>{e.preventDefault();keys[k]=true});['pointerup','pointerleave','pointercancel'].forEach(ev=>b.addEventListener(ev,()=>keys[k]=false))});
c.addEventListener('pointerdown',e=>{if(MODE==='tower'){let r=c.getBoundingClientRect();player.x=(e.clientX-r.left)/r.width*W;player.y=(e.clientY-r.top)/r.height*H;keys.action=true}else if(MODE==='arena')keys.action=true});c.addEventListener('pointerup',()=>keys.action=false);
if(MODE==='race')help.textContent='← → steer • ↑ accelerate • ↓ brake • Avoid traffic. Touch arrows on mobile.';
if(MODE==='tower')help.textContent='Move the cursor with arrows or tap the field to place a turret (40 credits). Defend the gate.';
if(MODE==='platform')help.textContent='← → move • ● / Space jump • Collect sparks and reach the exit. Touch buttons supported.';
if(MODE==='horror')help.textContent='Move with arrows or WASD. Collect every yellow spark, keep your battery alive and avoid the shadows.';
if(MODE==='arena')help.textContent='Move with arrows or WASD • ● / Space fire • Survive enemy waves. Touch controls supported.';
render();
})();
</script></body></html>
