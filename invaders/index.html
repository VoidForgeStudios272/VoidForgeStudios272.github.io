<!doctype html><html><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>VoidForge Invaders</title><style>body{margin:0;background:#080614;color:#fff;text-align:center;font:16px system-ui}canvas{display:block;margin:15px auto;border:1px solid #f5c}</style></head><body><h1>VoidForge Invaders</h1><p>Move with ← → • Space to fire</p><canvas id=c width=600 height=500></canvas><script>const c=document.getElementById('c'),x=c.getContext('2d');let ship=300,bul=[],en=[];for(let r=0;r<4;r++)for(let q=0;q<8;q++)en.push({x:70+q*65,y:60+r*45});let k={},dir=1;onkeydown=e=>k[e.key]=1;onkeyup=e=>k[e.key]=0;function loop(){x.clearRect(0,0,600,500);if(k.ArrowLeft)ship-=5;if(k.ArrowRight)ship+=5;if(k[' ' ]&&(!loop.t||performance.now()-loop.t>180)){bul.push({x:ship,y:450});loop.t=performance.now()}x.fillStyle='#5cf';x.fillRect(ship-20,465,40,15);x.fillStyle='#f5c';bul.forEach(b=>{b.y-=7;x.fillRect(b.x,b.y,4,10)});let edge=en.some(e=>e.x>575||e.x<25);if(edge)dir*=-1;en.forEach(e=>e.x+=dir*.5);en.forEach(e=>{x.fillStyle='#8f8';x.fillRect(e.x-15,e.y-10,30,20)});bul=bul.filter(b=>{let hit=false;en=en.filter(e=>{if(Math.hypot(b.x-e.x,b.y-e.y)<22){hit=true;return false}return true});return !hit&&b.y>0});requestAnimationFrame(loop)}loop()</script></body></html>
