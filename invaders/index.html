<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover"><title>VoidForge Invaders</title><style>body{margin:0;background:#080614;color:#fff;text-align:center;font:16px system-ui;touch-action:manipulation}canvas{display:block;width:min(94vw,600px);height:auto;margin:15px auto;border:1px solid #f5c;touch-action:none}.controls{display:flex;gap:8px;justify-content:center}.controls button{min-width:70px;height:52px;border:0;border-radius:10px;background:#27204b;color:#fff;font-size:22px;touch-action:manipulation}</style><style id="voidforge-mobile-compat">:root{color-scheme:dark}*,*::before,*::after{box-sizing:border-box}html{width:100%;min-width:0;min-height:100%;-webkit-text-size-adjust:100%;overscroll-behavior-x:none}body{width:100%;min-width:0;max-width:100%;min-height:100svh;overflow-x:hidden;padding-bottom:env(safe-area-inset-bottom)}img,svg,video,iframe,canvas{max-width:100%}canvas{touch-action:none;-webkit-user-select:none;user-select:none}button,[role="button"],input,select,textarea{font:inherit;touch-action:manipulation}button,[role="button"]{min-height:44px}:focus-visible{outline:2px solid #75baff;outline-offset:3px}@media(max-width:700px),(pointer:coarse){body{min-height:100dvh;padding-left:max(6px,env(safe-area-inset-left));padding-right:max(6px,env(safe-area-inset-right))}h1{font-size:clamp(21px,6vw,32px);overflow-wrap:anywhere}main,.app,.shell,.game,.container,.game-container,.gameContainer,.stage,.wrapper,.arena{width:100%;max-width:100%;min-width:0}canvas{max-width:100%;height:auto}button,[role="button"]{min-width:44px;min-height:46px}.controls,.pad,.actions,.mobile,.mobile-controls,#mobile,#mobileControls{max-width:100%;gap:8px;flex-wrap:wrap}.stats,.toolbar,.topbar,.header,.bottom,.bar{max-width:100%;flex-wrap:wrap}input,select,textarea{max-width:100%;min-width:0}}@media(orientation:landscape) and (max-height:520px){body{min-height:100dvh}.shell,.app,.game{padding-top:6px;padding-bottom:6px}}@media(prefers-reduced-motion:reduce){*,*::before,*::after{scroll-behavior:auto!important;animation-duration:.01ms!important;transition-duration:.01ms!important}}</style></head><body><h1>VoidForge Invaders</h1><p>Touch buttons to move and fire</p><canvas id=c width=600 height=500></canvas><div class=controls><button data-k=left>←</button><button data-k=fire>●</button><button data-k=right>→</button></div><script>const c=document.getElementById('c'),x=c.getContext('2d');let ship=300,bul=[],en=[];for(let r=0;r<4;r++)for(let q=0;q<8;q++)en.push({x:70+q*65,y:60+r*45});let k={},dir=1,PS=5,ES=.5,FIRE=180;onkeydown=e=>k[e.key]=1;onkeyup=e=>k[e.key]=0;document.querySelectorAll('[data-k]').forEach(b=>{b.onpointerdown=e=>{e.preventDefault();k[b.dataset.k]=1};b.onpointerup=b.onpointercancel=()=>k[b.dataset.k]=0});function loop(){x.clearRect(0,0,600,500);if(k.ArrowLeft||k.left)ship-=PS;if(k.ArrowRight||k.right)ship+=PS;if(k[' ' ]||k.fire){if(!loop.t||performance.now()-loop.t>FIRE){bul.push({x:ship,y:450});loop.t=performance.now()}}x.fillStyle='#5cf';x.fillRect(ship-20,465,40,15);x.fillStyle='#f5c';bul.forEach(b=>{b.y-=7;x.fillRect(b.x,b.y,4,10)});let edge=en.some(e=>e.x>575||e.x<25);if(edge)dir*=-1;en.forEach(e=>e.x+=dir*ES);en.forEach(e=>{x.fillStyle='#8f8';x.fillRect(e.x-15,e.y-10,30,20)});bul=bul.filter(b=>{let hit=false;en=en.filter(e=>{if(Math.hypot(b.x-e.x,b.y-e.y)<22){hit=true;return false}return true});return !hit&&b.y>0});ship=Math.max(20,Math.min(580,ship));requestAnimationFrame(loop)}loop();window.addEventListener('voidforge:game-settings-change',e=>{const q=e.detail?.settings||{};if(q.playerSpeed!==undefined)PS=Number(q.playerSpeed);if(q.enemySpeed!==undefined)ES=Number(q.enemySpeed);if(q.fireCooldown!==undefined)FIRE=Number(q.fireCooldown)});</script></body></html>
