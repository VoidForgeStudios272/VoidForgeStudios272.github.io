<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover"><title>VoidForge Invaders</title><style>body{margin:0;background:#080614;color:#fff;text-align:center;font:16px system-ui;touch-action:manipulation}canvas{display:block;width:min(94vw,600px);height:auto;margin:15px auto;border:1px solid #f5c;touch-action:none}.controls{display:flex;gap:8px;justify-content:center}.controls button{min-width:70px;height:52px;border:0;border-radius:10px;background:#27204b;color:#fff;font-size:22px;touch-action:manipulation}</style></head><body><h1>VoidForge Invaders</h1><p>Touch buttons to move and fire</p><canvas id=c width=600 height=500></canvas><div class=controls><button data-k=left>←</button><button data-k=fire>●</button><button data-k=right>→</button></div><script>const c=document.getElementById('c'),x=c.getContext('2d');let ship=300,bul=[],en=[];for(let r=0;r<4;r++)for(let q=0;q<8;q++)en.push({x:70+q*65,y:60+r*45});let k={},dir=1;onkeydown=e=>k[e.key]=1;onkeyup=e=>k[e.key]=0;document.querySelectorAll('[data-k]').forEach(b=>{b.onpointerdown=e=>{e.preventDefault();k[b.dataset.k]=1};b.onpointerup=b.onpointercancel=()=>k[b.dataset.k]=0});function loop(){x.clearRect(0,0,600,500);if(k.ArrowLeft||k.left)ship-=5;if(k.ArrowRight||k.right)ship+=5;if(k[' ' ]||k.fire){if(!loop.t||performance.now()-loop.t>180){bul.push({x:ship,y:450});loop.t=performance.now()}}x.fillStyle='#5cf';x.fillRect(ship-20,465,40,15);x.fillStyle='#f5c';bul.forEach(b=>{b.y-=7;x.fillRect(b.x,b.y,4,10)});let edge=en.some(e=>e.x>575||e.x<25);if(edge)dir*=-1;en.forEach(e=>e.x+=dir*.5);en.forEach(e=>{x.fillStyle='#8f8';x.fillRect(e.x-15,e.y-10,30,20)});bul=bul.filter(b=>{let hit=false;en=en.filter(e=>{if(Math.hypot(b.x-e.x,b.y-e.y)<22){hit=true;return false}return true});return !hit&&b.y>0});ship=Math.max(20,Math.min(580,ship));requestAnimationFrame(loop)}loop()</script></body></html>
