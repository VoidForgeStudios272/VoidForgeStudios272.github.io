name: VoidForge Checks 1.2

on:
  push:
    branches:
      - main

  pull_request:
    branches:
      - main

  workflow_dispatch:

jobs:
  checks:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v7

      - name: Setup Node.js
        uses: actions/setup-node@v6
        with:
          node-version: 24

      - name: Find JavaScript files
        shell: bash
        run: |
          set -e

          git ls-files --cached --others --exclude-standard \
            | grep -Ei '\.js$' \
            > js-files.txt || true

          echo "======================================"
          echo "JavaScript files:"
          echo "======================================"

          if [ -s js-files.txt ]; then
            cat js-files.txt
          else
            echo "No JavaScript files found."
          fi

      - name: Validate JavaScript
        shell: bash
        run: |
          set -e

          if [ ! -s js-files.txt ]; then
            echo "No JavaScript files found."
            exit 0
          fi

          FAILED=0

          while IFS= read -r file; do

            [ -z "$file" ] && continue

            echo ""
            echo "Checking $file"

            # The repository package.json is CommonJS, but browser files such as
            # game3d.js are native ES modules. Parse those as modules via stdin
            # without changing the runtime type of the rest of the project.
            if grep -Eq '^[[:space:]]*(import[[:space:]]|export[[:space:]]|export\{)' "$file"; then
              if node --input-type=module --check < "$file"; then
                echo "PASS (ES module): $file"
              else
                echo "FAIL (ES module): $file"
                FAILED=1
              fi
            elif node --check "$file"; then
              echo "PASS: $file"
            else
              echo "FAIL: $file"
              FAILED=1
            fi

          done < js-files.txt

          echo ""
          echo "======================================"

          if [ "$FAILED" -ne 0 ]; then
            echo "FAIL: JavaScript validation failed."
            exit 1
          fi

          echo "PASS: All JavaScript files."
