name: Copy upstream Among Us source into VoidForge

on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/vendor-among-us-source.yml'
  workflow_dispatch:

permissions:
  contents: write
  actions: write

concurrency:
  group: vendor-among-us-source
  cancel-in-progress: false

jobs:
  vendor:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout VoidForge
        uses: actions/checkout@v6
        with:
          fetch-depth: 0
      - name: Copy the upstream repository files
        run: |
          git clone --depth 1 https://github.com/arizkhalid/among-us-clone.git /tmp/among-us-upstream
          mkdir -p among-us
          cp -a /tmp/among-us-upstream/. among-us/
          rm -rf among-us/.git among-us/engine
          rm -f .gitmodules
          cat > among-us/README.md <<'EOF'
          # VoidForge Among Us

          This folder contains a direct copy of the source files from arizkhalid/among-us-clone, integrated into VoidForge Studios. The upstream MIT LICENSE and original source files are retained.

          - frontend/ — React + Phaser 3 game client and all public game assets.
          - backend/ — Node.js + Express + Socket.IO multiplayer server.
          - misc/ — upstream supporting files.

          ## Local development

          Start the backend: cd backend && npm ci && ALLOWED_ORIGIN=http://localhost:8080 npm start.
          Start the frontend in another terminal: cd frontend && npm ci && npm run dev.

          ## Deployment

          GitHub Pages builds the frontend into /among-us/. The Node.js backend must be deployed separately. The root render.yaml is configured for among-us/backend; set the repository Actions variable AMONG_US_BACKEND_URL to the deployed HTTPS origin.

          Upstream project: https://github.com/arizkhalid/among-us-clone
          EOF
          cat > among-us/INTEGRATION-STATUS.md <<'EOF'
          # Integration status

          All upstream repository files are copied directly into this directory. No Git submodule is used. See LICENSE and README.md for attribution and setup instructions.
          EOF
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A among-us .gitmodules
          git commit -m "Vendor complete Among Us source into VoidForge"
          git push origin main
      - name: Start Pages deployment
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh workflow run deploy-among-us-pages.yml --ref main
