<!doctype html><meta name="viewport" content="width=device-width,initial-scale=1"><title>VoidForge Flappy</title><style>body{margin:0;background:#080612;color:white;text-align:center;font:16px system-ui}canvas{max-width:94vw;background:#0d0920}</style><h1>VoidForge Flappy</h1><p>Click / Space</p><canvas id=c width=480 height=640></canvas><script>c=document.querySelector('canvas'),x=c.getContext('2d'),y=300,v=0,s=0,P=[],dead=0;onkeydown=e=>e.code==='Space'&&j();c.onclick=j;function j(){if(dead)return location.reload();v=-8}function f(){x.clearRect(0,0,480,640);v+=.35;y+=v;if(Math.random()<.018)P.push({x:480,g:130+Math.random()*260});x.fillStyle='#fff';x.beginPath();x.arc(100,y,16,0,7);x.fill();P.forEach(p=>{p.x-=3;x.fillRect(p.x,0,55,p.g-70);x.fillRect(p.x,p.g+70,55,640-p.g-70);if(!p.hit&&p.x+55<100){p.hit=1;s++}});x.font='30px system-ui';x.fillText(s,20,40);if(y<0||y>640||P.some(p=>p.x<116&&p.x+55>84&&(y<p.g-70||y>p.g+70))){dead=1;x.fillText('Game over — click',130,320);return}requestAnimationFrame(f)}f()</script>
