<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover"><meta name="theme-color" content="#10131d"><title>VoidForge Arcade</title><style>:root{color-scheme:dark;font-family:Inter,system-ui,sans-serif;background:#0c0f17;color:#f4f5fb}*{box-sizing:border-box}body{margin:0;min-height:100vh;background:radial-gradient(ellipse at 50% -15%,#292343,transparent 55%),#0c0f17;padding:20px}.top{max-width:920px;margin:auto;display:flex;justify-content:space-between;align-items:center}.back{color:#b7b7d0;text-decoration:none;font-weight:700}.pill,.eyebrow{font-size:11px;letter-spacing:.16em;color:#a99bff;font-weight:800}.pill{border:1px solid #4a426d;border-radius:30px;padding:8px 12px}main{max-width:920px;margin:30px auto}.intro,.play{background:#171b28;border:1px solid #2c3042;border-radius:24px;padding:clamp(18px,4vw,32px);box-shadow:0 20px 60px #0003}.intro h1{font-size:clamp(32px,6vw,54px);margin:9px 0}.intro p,.hint,.status{color:#aeb4c8}.stats{display:flex;gap:12px;margin-top:24px;flex-wrap:wrap}.stats div{background:#202638;border-radius:14px;padding:12px 18px;min-width:100px}.stats small{display:block;color:#a7adc0;font-size:10px;letter-spacing:.12em}.stats b{font-size:23px}.play{margin-top:16px}.stage{min-height:310px;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:18px}.prompt{font-size:20px;font-weight:800;text-align:center}.board{width:min(100%,500px);display:grid;grid-template-columns:repeat(4,minmax(0,1fr));gap:10px}.tile{border:1px solid #414862;border-radius:15px;min-height:76px;background:#252c40;color:#fff;font-size:20px;font-weight:800;touch-action:manipulation}.tile:active,.tile.good{background:#6554aa;transform:scale(.97)}.tile.dim{opacity:.25}.color-tile{background:var(--tile);color:#111;font-size:13px}.arena{width:100%;height:280px;position:relative;overflow:hidden;border-radius:18px;border:1px solid #414862;background:radial-gradient(circle at center,#252d48,#111522);touch-action:pan-y}.player,.goal{position:absolute;transform:translate(-50%,-50%);border:0}.player{background:#6c8cff;color:#fff;border-radius:50%;width:42px;height:42px;font-size:20px}.goal{color:#5bd3a7;font-size:30px}.controls{display:flex;justify-content:center;gap:10px;margin-top:16px}.primary,.secondary{border:0;border-radius:13px;padding:13px 20px;font-weight:800;cursor:pointer}.primary{background:linear-gradient(135deg,#8874ff,#5f8dff);color:white}.secondary{background:#2a3042;color:#e6e8f5}.status{text-align:center;min-height:22px}.hint{text-align:center;font-size:12px}.answer{grid-column:1/-1;min-width:0;width:100%;padding:16px;border-radius:12px;border:1px solid #424b66;background:#0e1320;color:white;font-size:18px}.board .primary,.board .secondary{grid-column:span 2}.stack-bar{grid-column:1/-1;height:58px;background:#2b344a;border-radius:12px;position:relative;overflow:hidden}.moving{position:absolute;left:0;top:0;width:16%;height:100%;background:#8a7bff;border-radius:10px}.card-total{grid-column:1/-1;text-align:center;font-size:28px;font-weight:900;padding:20px}.tile.exit{background:#48b88e;color:#071d15}.tile.visited{background:#3a4560}@media(max-width:520px){body{padding:12px}.top{padding:4px}.intro,.play{border-radius:18px;padding:18px}.stage{min-height:290px}.board{gap:7px}.tile{min-height:66px}.stats div{flex:1;min-width:0}.controls button{flex:1}.arena{height:250px}}</style></head><body data-game="block-breaker"><div id="arcadeGame"></div><script src="../assets/arcade-pack.js"></script></body></html>
